nombre: Condenas firmes a Jaume Matas (Palma Arena y Son Espases)
partido: pp
territorio: Islas Baleares
resumen: "El expresidente balear Jaume Matas acumula tres condenas firmes. En el caso Palma Arena el Supremo redujo en 2013 la pena inicial de seis años a nueve meses y en 2015 confirmó una multa por conseguir que un hotelero pagara a su mujer un contrato simulado; en 2021 confirmó diez meses de cárcel por intentar amañar el concurso del hospital de Son Espases."
firme:
  tribunal: "Tribunal Supremo"
  fecha: 2021-11-02
condenas:
  - persona: "Jaume Matas"
    cargo: "Expresidente del Govern balear y exministro (PP)"
    pena: "Diez meses de prisión por tráfico de influencias y como inductor de prevaricación y fraude (Son Espases); multa por el contrato simulado de su mujer (Palma Arena, 2015); nueve meses por Palma Arena (2013)"
nota: "Las dos condenas de Palma Arena y la de Son Espases son procedimientos distintos; la fecha indicada es la de la última sentencia firme."
