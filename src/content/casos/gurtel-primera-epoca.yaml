nombre: Gürtel (primera época)
partido: pp
territorio: Madrid y Valencia
resumen: "Trama de contratos públicos y comisiones en torno al empresario Francisco Correa, con vínculos con cargos del PP. La Audiencia Nacional (mayo de 2018) condenó a Correa a 51 años de prisión y a Luis Bárcenas, extesorero del PP, a 33; el Tribunal Supremo (octubre de 2020) confirmó la sentencia, rebajó las penas de Bárcenas a 29 años y 1 mes y de Pablo Crespo a 36 años y 8 meses, y eliminó las alusiones a una «caja B» del partido."
firme:
  tribunal: "Tribunal Supremo (STS 507/2020)"
  fecha: 2020-10-14
condenas:
  - persona: "Francisco Correa"
    cargo: "Empresario"
    pena: "51 años de prisión (el Supremo los mantuvo con un ajuste de meses)"
  - persona: "Luis Bárcenas"
    cargo: "Extesorero del PP"
    pena: "29 años y 1 mes de prisión tras el Supremo"
  - persona: "Pablo Crespo"
    cargo: "Socio de Correa"
    pena: "36 años y 8 meses de prisión tras el Supremo"
  - persona: "Ana Mato"
    cargo: "Exministra de Sanidad del PP"
    pena: "Pago de 27.857 euros como partícipe a título lucrativo"
responsabilidad_partido: "El PP fue condenado como partícipe a título lucrativo por beneficiarse de 245.492 euros procedentes de la trama (actos electorales en Majadahonda y Pozuelo). Un voto particular del presidente del tribunal discrepó de esa condena."
cuantia:
  euros: 245492
  concepto: "Importe que el PP debe devolver como partícipe a título lucrativo (no es el total de la trama)"
nota: "Quedan otras piezas y épocas de la trama con sentencias distintas, que no se incluyen aquí."
