nombre: Caso Cooperación (primera pieza)
partido: pp
territorio: Comunidad Valenciana
resumen: "Desvío de subvenciones de la Generalitat Valenciana para proyectos de cooperación en Nicaragua. El Tribunal Supremo condenó en 2015 al exconseller Rafael Blasco (PP) y a otros cargos de la Conselleria de Inmigración y Ciudadanía por malversación, prevaricación y falsedad."
firme:
  tribunal: "Tribunal Supremo"
  fecha: 2015-06-10
condenas:
  - persona: "Rafael Blasco"
    cargo: "Exconseller de la Generalitat Valenciana (PP)"
    pena: "6 años y 6 meses de prisión"
  - persona: "Agustina Sanjuan"
    cargo: "Exsecretaria general de la Conselleria"
    pena: "6 años de prisión"
  - persona: "Augusto César Tauroni"
    cargo: "Intermediario"
    pena: "6 años de prisión"
nota: "Las fuentes no coinciden en el importe: la nota del CGPJ habla de 1,6 millones invertidos en los dos proyectos, de los que llegaron a su destino 47.953 euros; La Marea, de 1,8 millones desviados. Por eso no se muestra cuantía. La fecha es la de la nota del CGPJ. Hubo condenas posteriores en otras piezas del caso."
