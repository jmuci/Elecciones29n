nombre: Caso Marea
partido: psoe
territorio: Asturias
resumen: "Adjudicaciones amañadas en la Consejería de Educación del Principado de Asturias a cambio de dádivas de empresarios, durante el Gobierno de Vicente Álvarez Areces (PSOE). La Audiencia de Asturias condenó en 2017 y el Supremo confirmó en septiembre de 2019 la mayor parte de las condenas, de hasta nueve años de prisión."
firme:
  tribunal: "Tribunal Supremo"
  fecha: 2019-09-12
condenas:
  - persona: "José Luis Iglesias Riopedre"
    cargo: "Exconsejero de Educación del Principado de Asturias"
    pena: "Seis años de prisión en la Audiencia (2017); el Supremo mantuvo una multa de 400.000 euros"
  - persona: "Marta Renedo"
    cargo: "Funcionaria de la Consejería"
    pena: "9 años de prisión y multa de 480.000 euros"
  - persona: "María Jesús Otero"
    cargo: "Exdirectora general de Educación"
    pena: "5 años y 5 meses de prisión tras el Supremo"
nota: "La nota del Supremo cifra las dádivas en más de dos millones de euros, pero no da un importe de malversación, por lo que no se muestra cuantía."
fuentes:
  - medio: "Consejo General del Poder Judicial"
    titulo: "El Tribunal Supremo impone penas de hasta nueve años de prisión a los principales acusados del «caso Marea» por delitos de prevaricación, malversación, cohecho y falsedad"
