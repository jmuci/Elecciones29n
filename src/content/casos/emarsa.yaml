      titulo: "La Audiencia de Valencia condena a penas que oscilan entre los nueve meses y los doce años y medio de cárcel a los 24 acusados del caso Emarsa"
      url: "https://www.poderjudicial.es/cgpj/es/Poder-Judicial/Noticias-Judiciales/La-Audiencia-de-Valencia-condena-a-penas-que-oscilan-entre-los-nueve-meses-y-los-doce-anos-y-medio-de-carcel-a-los-24-acusados-del-caso-Emarsa"
      tipo: institucion
      fecha: 2018-06-22
