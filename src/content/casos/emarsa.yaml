      titulo: "El Supremo ratifica las penas de prisión para los cabecillas del caso Emarsa"
      url: "https://valenciaplaza.com/supremo-ratifica-penas-emarsa"
      tipo: prensa
      fecha: 2020-10-09
nota: "La fecha de la sentencia firme es la de su difusión (9 de octubre de 2020); la fuente no da el día exacto del fallo."
