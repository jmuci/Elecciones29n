nombre: Caso Emarsa
partido: pp
territorio: Comunidad Valenciana (área metropolitana de Valencia)
resumen: "Desvío de fondos de Emarsa, la empresa pública que gestionaba la depuradora de Pinedo. La Audiencia de Valencia condenó en junio de 2018 a sus principales responsables y el Supremo confirmó en octubre de 2020 las penas de los cabecillas. El exgerente Esteban Cuesta era militante del PP, que suspendió su militancia en 2011."
firme:
  tribunal: "Tribunal Supremo"
  fecha: 2020-10-09
condenas:
  - persona: "Esteban Cuesta"
    cargo: "Exgerente de Emarsa"
    pena: "12 años de prisión"
  - persona: "Enrique Crespo"
    cargo: "Exvicepresidente de la Diputación de Valencia y expresidente de Emarsa"
    pena: "10 años de prisión"
  - persona: "José Juan Morenilla"
    cargo: "Exgerente de la Entidad Pública de Saneamiento de Aguas Residuales (Epsar)"
    pena: "9 años de prisión"
cuantia:
  euros: 23500000
  concepto: "Dinero público desviado de Emarsa, según la Audiencia de Valencia; el Supremo confirmó la sentencia en lo principal"
  fuentes:
