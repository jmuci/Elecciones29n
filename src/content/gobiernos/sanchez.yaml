logros:
  - titulo: Subidas del salario mínimo (SMI)
    descripcion: "El SMI pasó de 735 euros mensuales en 14 pagas en 2017-2018 a 1.184 en 2025, una subida del 61 % según Sánchez, y a 1.221 en 2026 (+3,1 %). La patronal CEOE se desmarcó de la subida de 2026."
    fuentes:
      - medio: "Menorca.info (agencias)"
        titulo: "Sánchez niega que exista una crisis con Sumar: «En absoluto»"
        url: "https://www.menorca.info/actualidad/nacional/2025/02/12/2324573/sanchez-niega-exista-crisis-sumar-absoluto.html"
        tipo: prensa
        fecha: 2025-02-12
      - medio: "Última Hora (agencias)"
        titulo: "Pedro Sánchez recrimina a CEOE que «se borre» de la subida del SMI y le insta a «pagar más» subiendo sueldos"
        url: "https://www.ultimahora.es/noticias/nacional/2026/02/16/2571347/pedro-sanchez-recrimina-ceoe-borre-subida-del-smi-insta-pagar-mas-subiendo-sueldos.html"
        tipo: prensa
        fecha: 2026-02-16
  - titulo: Reforma laboral de 2021 y temporalidad
    descripcion: "Según CaixaBank Research, la tasa de temporalidad pasó de una media cercana al 29,7 % en 2014-2019 al 12,7 % en 2024. El Salto Diario atribuye la bajada de siete puntos en el primer año a la reforma de Yolanda Díaz."
    fuentes:
      - medio: "CaixaBank Research"
        titulo: "La estabilidad del empleo mejora en España"
        url: "https://www.caixabankresearch.com/es/economia-y-mercados/mercado-laboral-y-demografia/estabilidad-del-empleo-mejora-espana"
        tipo: estudio
      - medio: "El Salto"
        titulo: "La bajada de siete puntos de la temporalidad avala el balance de la reforma laboral de Yolanda Díaz"
        url: "https://www.elsaltodiario.com/laboral/bajada-7-puntos-temporalidad-avala-balance-primer-ano-reforma-laboral-yolanda-diaz"
        tipo: prensa
  - titulo: ERTE e Ingreso Mínimo Vital durante la pandemia (2020-2021)
    descripcion: "Según la Seguridad Social, el pico de trabajadores en ERTE fue de 3,6 millones y más de 4,2 millones estuvieron protegidos en algún momento; en mayo de 2021 más de 300.000 hogares cobraban el Ingreso Mínimo Vital. Funcas concluyó que las ayudas compensaron de forma significativa la caída de rentas. Aun así, el empleo se redujo en 622.600 puestos en 2020."
    fuentes:
      - medio: "Funcas"
        titulo: "Impacto social de la pandemia en España"
        url: "https://www.funcas.es/wp-content/uploads/2020/11/Impacto-social-de-la-pandemia-en-Espa%C3%B1a.pdf"
        tipo: estudio
        fecha: 2020-11-01
