  - titulo: Precio del alquiler y balance de la Ley de Vivienda
    descripcion: "Según idealista (junio de 2026), el alquiler marca máximos (15,1 euros por m²) con la oferta en mínimos. El Ministerio de Vivienda cifra en 301 los municipios declarados zona tensionada y defiende que la ley funciona; un estudio de Fedea de 2026 concluye que, donde se aplica, la moderación del precio convive con una contracción de la oferta."
