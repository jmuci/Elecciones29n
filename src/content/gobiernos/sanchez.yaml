  - titulo: Reforma laboral de 2021 y temporalidad
    descripcion: "Según CaixaBank Research, la tasa de temporalidad pasó de una media cercana al 29,7 % en 2014-2019 al 12,7 % en 2024. El Salto Diario atribuye la bajada de siete puntos en el primer año a la reforma de Yolanda Díaz."
