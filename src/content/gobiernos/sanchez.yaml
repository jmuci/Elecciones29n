    - titulo: Precios (2021-2026)
      descripcion: "La inflación media (IPCA, Eurostat) fue del 3,0 % en 2021, del 8,3 % en 2022, del 3,4 % en 2023, del 2,9 % en 2024 y del 2,7 % en 2025. El indicador adelantado del INE sitúa el IPC de octubre de 2026 en el 4,9 % interanual, igual que en septiembre, con la subyacente en el 3,1 %. El Banco de España proyecta una inflación media del 3,9 % en 2026 y del 3,7 % en 2027."
      fuentes:
