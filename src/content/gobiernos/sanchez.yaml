criticas:
  - titulo: Condena del exministro Ábalos y de Koldo García (caso mascarillas, 2026)
    descripcion: "El 22 de junio de 2026 el Tribunal Supremo condenó por unanimidad a José Luis Ábalos, ministro de Transportes entre 2018 y 2021, a 24 años y 3 meses de prisión, y a Koldo García a 19 años y 8 meses, por organización criminal, cohecho, malversación y tráfico de influencias. Ábalos sostiene que fue un juicio «político» y recurrirá al Constitucional. Ver el detalle en la sección de corrupción."
    fuentes:
      - medio: "RTVC"
        titulo: "El Supremo condena a Ábalos a 24 años de cárcel"
        url: "https://rtvc.es/el-supremo-condena-a-abalos-a-24-anos-de-carcel-22-junio-2026/"
        tipo: prensa
        fecha: 2026-06-22
      - medio: "Ara"
        titulo: "El Supremo condena a Ábalos a 24 años de prisión por «corrupción orgánica, organizada y continuada»"
        url: "https://es.ara.cat/politica/supremo-condena-exministro-abalos-24-anos-prision_1_5776792.html"
        tipo: prensa
        fecha: 2026-06-22
  - titulo: Ley de amnistía (2024)
    descripcion: "La ley de amnistía fue condición del apoyo de Junts al Gobierno. En enero de 2024 Junts votó en contra y la norma decayó en el Congreso; en marzo el Gobierno aceptó cambios para dar más garantías a Junts. El PP y otros críticos la consideran un pago por los apoyos parlamentarios; el Gobierno defiende que favorece la convivencia."
    fuentes:
      - medio: "La Marea"
        titulo: "Decae la ley de amnistía tras el voto en contra de Junts"
        url: "https://lamarea.com/2024/01/30/decae-la-ley-aministia-tras-el-voto-en-contra-de-junts"
        tipo: prensa
        fecha: 2024-01-30
