        tipo: institucion
        fecha: 2021-05-16
      - medio: "Noticias de Navarra"
        titulo: "Los ERTE no evitan la pérdida de 622.600 empleos en 2020"
        url: "https://www.noticiasdenavarra.com/economia/2021/01/28/erte-evitan-perdida-622-600-2172067.amp.html"
