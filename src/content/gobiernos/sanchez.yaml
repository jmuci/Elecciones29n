          url: "https://ec.europa.eu/eurostat/databrowser/view/gov_10dd_edpt1/default/table?lang=en"
          tipo: institucion
  percepcion:
    - titulo: Valoración de la economía en el CIS (2020, 2022 y 2026)
      descripcion: "En enero de 2020 el 6,4 % calificó de buena o muy buena la situación económica general de España, el 46,4 % de regular y el 46,5 % de mala o muy mala; sobre la propia, el 35,4 %, el 48,0 % y el 16,2 %. En octubre de 2022 (sin «regular» entre las opciones leídas) la general era buena o muy buena para el 17,4 % y mala o muy mala para el 73,2 %; la personal, buena o muy buena para el 62,9 % y mala o muy mala para el 25,3 %. En octubre de 2026, la general: 36,2 % buena o muy buena y 57,8 % mala o muy mala; la personal: 68,4 % y 22,9 %. Como la formulación cambió, las cifras de 2020 y las posteriores no son directamente comparables."
      fuentes:
        - medio: "CIS"
          titulo: "Barómetro de enero 2020 (estudio 3271)"
          url: "https://www.cis.es/estudios/barometro-de-enero-2020"
          tipo: institucion
        - medio: "CIS"
          titulo: "Barómetro de octubre 2022 (estudio 3380)"
          url: "https://www.cis.es/estudios/barometro-de-octubre-2022"
          tipo: institucion
        - medio: "CIS"
          titulo: "Barómetro de octubre 2026 (estudio 3582)"
          url: "https://www.cis.es/estudios/barometro-de-octubre-2026"
          tipo: institucion
    - titulo: Principales problemas del país según el CIS (2020-2026)
      descripcion: "Como primer problema, en enero de 2020 el paro fue citado por el 36,8 % (58,9 % en total). En octubre de 2022, la crisis económica por el 24,3 % (44,1 % en total) y el paro por el 12,7 %. En octubre de 2025 la vivienda fue primer problema para el 19,2 % (37,1 % en total) y en octubre de 2026 para el 29,9 % (55,7 % en total), por delante de la inmigración (20,9 % en total), la crisis económica (20,3 %) y la calidad del empleo (19,4 %). El CIS recodificó categorías desde 2025, así que la comparación con años anteriores es aproximada."
      fuentes:
        - medio: "CIS"
          titulo: "Barómetro de enero 2020 (estudio 3271)"
          url: "https://www.cis.es/estudios/barometro-de-enero-2020"
          tipo: institucion
        - medio: "CIS"
          titulo: "Barómetro de octubre 2022 (estudio 3380)"
          url: "https://www.cis.es/estudios/barometro-de-octubre-2022"
          tipo: institucion
        - medio: "CIS"
