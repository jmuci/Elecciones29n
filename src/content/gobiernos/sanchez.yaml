          tipo: institucion
    - titulo: Condiciones de vida, salarios y vivienda (2018-2026)
      descripcion: "Según Eurostat, el riesgo de pobreza o exclusión social (AROPE) pasó del 27,3 % en 2018 al 25,7 % en 2025. El porcentaje que declaraba llegar a fin de mes «con mucha dificultad» fue del 7,8 % en 2019, del 10,0 % en 2020 y del 8,5 % en 2025 (6,4 % en la UE ese año). El precio de la vivienda subió de media un 8,5 % en 2024 y un 12,7 % en 2025. Según el Banco de España, el aumento salarial pactado en convenios en 2026 es del 3,0 % (datos hasta agosto), frente al 3,5 % de 2025; el IPC de octubre de 2026 es del 4,9 %."
