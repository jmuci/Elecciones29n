presidente: Pedro Sánchez
partido: psoe
bloque: izquierda
inicio: 2018-06-02
orden: 4
resumen: "Llegó a la presidencia mediante la moción de censura de junio de 2018 y revalidó el cargo tras las elecciones de 2019 y de 2023. Gobierna en coalición con Unidas Podemos desde enero de 2020 y con Sumar desde 2023. Sigue en el cargo hasta las elecciones del 29 de noviembre de 2026."
destacados:
  - nombre: "Nadia Calviño"
    cargo: "Vicepresidenta y ministra de Economía (2018-2023)"
  - nombre: "Pablo Iglesias"
    cargo: "Vicepresidente segundo (2020-2021)"
  - nombre: "Yolanda Díaz"
    cargo: "Vicepresidenta y ministra de Trabajo"
  - nombre: "María Jesús Montero"
    cargo: "Ministra de Hacienda y vicepresidenta"
  - nombre: "Fernando Grande-Marlaska"
    cargo: "Ministro del Interior"
  - nombre: "José Luis Ábalos"
    cargo: "Ministro de Fomento y Transportes (2018-2021)"
revisado: 2026-11-02
contexto:
  internacional:
    - titulo: Pandemia de COVID-19 (2020-2021)
      descripcion: "El Real Decreto 463/2020, de 14 de marzo, declaró el estado de alarma en España para gestionar la crisis sanitaria del COVID-19. Según Eurostat, el PIB cayó un 10,9 % en 2020 (ver Macroeconomía)."
      fuentes:
        - medio: "BOE"
          titulo: "Real Decreto 463/2020, de 14 de marzo, por el que se declara el estado de alarma para la gestión de la situación de crisis sanitaria ocasionada por el COVID-19"
          url: "https://www.boe.es/buscar/act.php?id=BOE-A-2020-3692"
          tipo: institucion
          fecha: 2020-03-14
    - titulo: Invasión rusa de Ucrania y crisis energética (2022)
      descripcion: "Según el FMI, tras la invasión rusa de Ucrania los precios del gas en Europa llegaron a multiplicar por más de cuatro los de 2021 al reducirse las entregas de Rusia a menos del 20 % del volumen de 2021. En mayo de 2022 el Gobierno aprobó un mecanismo temporal que limita el efecto del precio del gas sobre el precio mayorista de la electricidad (la llamada «excepción ibérica»), que empezó a aplicarse el 14 de junio de 2022."
      fuentes:
        - medio: "FMI"
          titulo: "World Economic Outlook, October 2022: Countering the Cost-of-Living Crisis"
          url: "https://www.imf.org/-/media/files/publications/weo/2022/october/english/execsum.pdf"
          tipo: institucion
          fecha: 2022-10-11
        - medio: "BOE"
          titulo: "Real Decreto-ley 10/2022, de 13 de mayo, por el que se establece con carácter temporal un mecanismo de ajuste de costes de producción para la reducción del precio de la electricidad en el mercado mayorista"
          url: "https://www.boe.es/buscar/act.php?id=BOE-A-2022-7843"
          tipo: institucion
          fecha: 2022-05-14
    - titulo: Conflicto en Oriente Medio y guerra en Irán (2026)
      descripcion: "Según el Banco de España, el conflicto en Oriente Medio ha provocado un choque energético en 2026: tras romperse en julio el memorando de entendimiento entre Estados Unidos e Irán, entre el 21 de mayo y el 24 de septiembre el petróleo subió un 4 % y el gas natural un 52 %. El Banco de España cita las perturbaciones en los mercados de la energía, el alza de los precios de los bienes y la persistencia de la inflación en los servicios como impulsores del aumento de la inflación de 2026, y señala que la confianza del consumidor retrocedió tras el estallido de la guerra en Irán y se ha recuperado en parte."
      fuentes:
        - medio: "Banco de España"
          titulo: "Proyecciones macroeconómicas e informe trimestral de la economía española. Tercer trimestre 2026"
          url: "https://www.bde.es/wbe/en/publicaciones/analisis-economico-investigacion/proyecciones-macro-informe-trimestral/proyecciones-e-informe-trimestral-de-la-economia-espanola-tercer-trimestre-2026.html"
          tipo: institucion
  economia_global:
    - titulo: Inflación mundial y tipos de interés (2022-2026)
      descripcion: "El FMI proyectó en octubre de 2022 que la inflación mundial pasaría del 4,7 % en 2021 al 8,8 % en 2022. Según el BCE, el tipo de las operaciones principales de financiación subió del 0,00 % al 0,50 % el 27 de julio de 2022 y llegó al 4,50 % en septiembre de 2023; después bajó (el tipo de depósito, al 2,00 % en junio de 2025) y volvió a subir 25 puntos básicos el 17 de junio y el 16 de septiembre de 2026. El Banco de España señala que desde el 21 de mayo de 2026 el rendimiento del bono español a diez años ha subido 55 puntos básicos."
      fuentes:
        - medio: "FMI"
          titulo: "World Economic Outlook, October 2022: Countering the Cost-of-Living Crisis"
          url: "https://www.imf.org/-/media/files/publications/weo/2022/october/english/execsum.pdf"
          tipo: institucion
          fecha: 2022-10-11
        - medio: "Banco Central Europeo"
          titulo: "Official interest rates"
          url: "https://www.ecb.europa.eu/stats/policy_and_exchange_rates/key_ecb_interest_rates/html/index.en.html"
          tipo: institucion
        - medio: "Banco de España"
          titulo: "Proyecciones macroeconómicas e informe trimestral de la economía española. Tercer trimestre 2026"
          url: "https://www.bde.es/wbe/en/publicaciones/analisis-economico-investigacion/proyecciones-macro-informe-trimestral/proyecciones-e-informe-trimestral-de-la-economia-espanola-tercer-trimestre-2026.html"
          tipo: institucion
    - titulo: Fondos europeos NextGenerationEU (2021 en adelante)
      descripcion: "La Comisión Europea valoró positivamente en 2021 el plan de recuperación español, financiado con 69.500 millones de euros en subvenciones del Mecanismo de Recuperación y Resiliencia, con 211 medidas (102 reformas y 109 inversiones) que el Consejo aprobó el 13 de julio de 2021. El plan se modificó después y su importe total, con préstamos, ha cambiado en las revisiones posteriores."
      fuentes:
        - medio: "Comisión Europea"
          titulo: "Spain's recovery and resilience plan"
          url: "https://commission.europa.eu/business-economy-euro/economic-recovery/spains-recovery-and-resilience-plan_en"
          tipo: institucion
        - medio: "Comisión Europea"
          titulo: "Recovery and Resilience Facility: Spain factsheet (NextGenEU)"
          url: "https://commission.europa.eu/system/files/2021-06/spain-recovery-resilience-factsheet_en.pdf"
          tipo: institucion
    - titulo: Política comercial de Estados Unidos (2025-2026)
      descripcion: "Según el Banco de España, la política comercial estadounidense sigue marcada por la incertidumbre: un recargo a las importaciones impuesto de forma temporal (hasta julio) en sustitución de los «aranceles recíprocos», la posibilidad de nuevos aranceles tras una investigación sobre exceso de capacidad en sectores manufactureros de varias economías, entre ellas la Unión Europea, y tensiones comerciales entre Estados Unidos y Canadá."
      fuentes:
        - medio: "Banco de España"
          titulo: "Proyecciones macroeconómicas e informe trimestral de la economía española. Tercer trimestre 2026"
          url: "https://www.bde.es/wbe/en/publicaciones/analisis-economico-investigacion/proyecciones-macro-informe-trimestral/proyecciones-e-informe-trimestral-de-la-economia-espanola-tercer-trimestre-2026.html"
          tipo: institucion
economia:
  macro:
    - titulo: Crecimiento y empleo (2018-2026)
      descripcion: "Según Eurostat, el PIB real creció un 2,4 % en 2018 y un 2,0 % en 2019, cayó un 10,9 % en 2020 y creció un 6,7 % en 2021, un 6,4 % en 2022, un 2,4 % en 2023, un 3,7 % en 2024 y un 2,6 % en 2025. El INE sitúa el crecimiento del segundo trimestre de 2026 en el 2,6 % interanual. La tasa de paro (Eurostat) fue del 15,3 % en 2018, del 14,1 % en 2019, del 15,5 % en 2020 y del 10,5 % en 2025. En el tercer trimestre de 2026 la EPA da un 10,18 % de paro (31 centésimas más que en el trimestre anterior) y 22.852.600 ocupados, 465.500 más que un año antes."
      fuentes:
        - medio: "Eurostat"
          titulo: "Gross domestic product (GDP) and main components - annual data (nama_10_gdp)"
          url: "https://ec.europa.eu/eurostat/databrowser/view/nama_10_gdp/default/table?lang=en"
          tipo: institucion
