          url: "https://www.bde.es/wbe/en/publicaciones/analisis-economico-investigacion/proyecciones-macro-informe-trimestral/proyecciones-e-informe-trimestral-de-la-economia-espanola-tercer-trimestre-2026.html"
          tipo: institucion
    - titulo: Saldo y deuda de las administraciones públicas
      descripcion: "Según Eurostat, el saldo fue del −3,1 % del PIB en 2019, del −9,9 % en 2020 y del −2,4 % en 2025. La deuda pasó del 97,7 % del PIB en 2019 al 119,3 % en 2020 y al 100,5 % en 2025."
      fuentes:
        - medio: "Eurostat"
