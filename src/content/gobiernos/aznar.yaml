presidente: José María Aznar
partido: pp
bloque: derecha
inicio: 1996-05-05
fin: 2004-04-17
orden: 1
resumen: "El PP gobernó con apoyos parlamentarios entre 1996 y 2000 y con mayoría absoluta (183 escaños) desde las elecciones de marzo de 2000 hasta las de marzo de 2004. La línea de tiempo muestra solo el periodo posterior a 2000."
destacados:
  - nombre: "Mariano Rajoy"
    cargo: "Vicepresidente primero y ministro de la Presidencia, y después ministro del Interior"
  - nombre: "Rodrigo Rato"
    cargo: "Vicepresidente segundo y ministro de Economía"
  - nombre: "Josep Piqué"
    cargo: "Ministro de Asuntos Exteriores (2000-2002)"
  - nombre: "Ana Palacio"
    cargo: "Ministra de Asuntos Exteriores (2002-2004)"
  - nombre: "Federico Trillo"
    cargo: "Ministro de Defensa"
  - nombre: "Ángel Acebes"
    cargo: "Ministro del Interior (2002-2004)"
nota_revision: "Primera pasada: de momento hay menos logros que críticas documentados con fuente. No es una valoración; se buscan más fuentes para los logros."
revisado: 2026-11-02
contexto:
  internacional:
    - titulo: Guerra de Irak y cumbre de las Azores (2003)
      descripcion: "En marzo de 2003 Estados Unidos y Reino Unido iniciaron la invasión de Irak. España apoyó políticamente la operación y participó en la cumbre de las Azores (ver Críticas). En el barómetro del CIS de febrero de 2004, «La guerra de Irak» figuraba entre los tres principales problemas del país para el 2,2 % de los encuestados."
      fuentes:
        - medio: "Real Instituto Elcano"
          titulo: "ARI 49/2003: Cuestionario tras la cumbre de Azores"
          url: "https://www.realinstitutoelcano.org/wp-content/uploads/2021/12/ari-49-2003-e.pdf"
          tipo: estudio
          fecha: 2003-03-20
        - medio: "CIS"
          titulo: "Barómetro de febrero 2004 (estudio 2556)"
          url: "https://www.cis.es/estudios/barometro-de-febrero-2004"
          tipo: institucion
    - titulo: Atentados del 11-M (2004)
      descripcion: "El 11 de marzo de 2004, tres días antes de las elecciones generales, hubo atentados contra trenes de cercanías en Madrid. La sentencia de la Audiencia Nacional del 31 de octubre de 2007 concluyó que fueron obra de células o grupos terroristas de tipo yihadista. En el barómetro del CIS de febrero de 2004, anterior a los atentados, el terrorismo de ETA era el segundo problema más citado (40,1 % entre los tres principales), tras el paro (61,0 %)."
      fuentes:
        - medio: "La Moncloa"
          titulo: "Grande-Marlaska: «El 11M, la sociedad española volvió a demostrar que no hay terrorismo capaz de doblegarla»"
          url: "https://www.lamoncloa.gob.es/serviciosdeprensa/notasprensa/interior/paginas/2024/060324-marlaska-exposicion-11m.aspx"
          tipo: institucion
          fecha: 2024-03-06
        - medio: "CIS"
          titulo: "Barómetro de febrero 2004 (estudio 2556)"
          url: "https://www.cis.es/estudios/barometro-de-febrero-2004"
          tipo: institucion
  economia_global:
    - titulo: Desaceleración mundial de 2001-2002
      descripcion: "Según el FMI, el crecimiento mundial pasó de casi el 5 % en 2000 a menos del 3 % en 2001, por la caída del sector tecnológico, sobre todo en Estados Unidos, y las dificultades de Japón. Tras los atentados del 11 de septiembre de 2001, el FMI recortó la previsión de 2001 al 2,4 % y retrasó la recuperación esperada a mediados de 2002; concluyó que la economía mundial ya se frenaba antes de esos atentados."
      fuentes:
        - medio: "FMI"
          titulo: "IMF Survey, septiembre de 2001"
          url: "https://www.imf.org/external/pubs/ft/survey/2001/090101.pdf"
          tipo: institucion
          fecha: 2001-09-01
        - medio: "FMI"
          titulo: "Managing Director's Note: An Initial Assessment of Prospects for the Global Economy Following the Events of September 11"
          url: "https://www.imf.org/external/np/omd/2001/111301.htm"
          tipo: institucion
          fecha: 2001-11-13
    - titulo: Política monetaria única y bajada de tipos del BCE
      descripcion: "España está en el euro desde su primera fase, en 1999, y desde entonces los tipos de interés oficiales los fija el Banco Central Europeo para toda la zona. Según el BCE, el tipo de las operaciones principales de financiación bajó del 4,75 % (octubre de 2000) al 2,00 % (junio de 2003)."
      fuentes:
        - medio: "Banco Central Europeo"
          titulo: "Official interest rates"
          url: "https://www.ecb.europa.eu/stats/policy_and_exchange_rates/key_ecb_interest_rates/html/index.en.html"
          tipo: institucion
economia:
  macro:
    - titulo: Crecimiento e inflación (2000-2003)
      descripcion: "Según Eurostat, el PIB real creció un 5,2 % en 2000, un 3,9 % en 2001, un 2,8 % en 2002 y un 2,9 % en 2003. La inflación media (IPCA) fue del 3,5 %, 2,8 %, 3,6 % y 3,1 % en esos años."
      fuentes:
        - medio: "Eurostat"
          titulo: "Gross domestic product (GDP) and main components - annual data (nama_10_gdp)"
          url: "https://ec.europa.eu/eurostat/databrowser/view/nama_10_gdp/default/table?lang=en"
          tipo: institucion
        - medio: "Eurostat"
          titulo: "HICP - annual data (prc_hicp_aind)"
          url: "https://ec.europa.eu/eurostat/databrowser/view/prc_hicp_aind/default/table?lang=en"
          tipo: institucion
    - titulo: Paro (1996-2003)
      descripcion: "La tasa de paro (Eurostat, población de 15 a 74 años) bajó del 22,2 % en 1996 al 13,8 % en 2000 y al 11,3 % en 2003. La serie tiene cambios metodológicos de la Encuesta de Población Activa, por lo que los saltos entre años concretos deben leerse con cautela."
      fuentes:
        - medio: "Eurostat"
          titulo: "Unemployment rates by citizenship (lfsa_urgan)"
          url: "https://ec.europa.eu/eurostat/databrowser/view/lfsa_urgan/default/table?lang=en"
          tipo: institucion
    - titulo: Saldo y deuda de las administraciones públicas
      descripcion: "Según Eurostat, el saldo pasó del −5,9 % del PIB en 1996 al −0,4 % en 2003, y la deuda del 65,4 % al 47,7 % del PIB. La serie actual de Eurostat da un saldo ligeramente negativo en 2003, mientras que las fuentes de la época citadas en Logros hablan de equilibrio y superávit: las estadísticas se revisan con el tiempo."
      fuentes:
        - medio: "Eurostat"
          titulo: "Government deficit/surplus, debt and associated data (gov_10dd_edpt1)"
          url: "https://ec.europa.eu/eurostat/databrowser/view/gov_10dd_edpt1/default/table?lang=en"
          tipo: institucion
  percepcion:
    - titulo: Valoración de la economía en el CIS (febrero de 2004)
      descripcion: "Preguntados por la situación económica general de España, el 29,2 % la calificó de buena o muy buena, el 47,0 % de regular y el 22,0 % de mala o muy mala. Sobre dentro de un año, el 12,9 % esperaba que fuera mejor, el 52,5 % igual y el 14,9 % peor."
      fuentes:
        - medio: "CIS"
          titulo: "Barómetro de febrero 2004 (estudio 2556)"
          url: "https://www.cis.es/estudios/barometro-de-febrero-2004"
          tipo: institucion
    - titulo: Principales problemas del país según el CIS (febrero de 2004)
      descripcion: "Entre los tres problemas principales que citaron los encuestados (respuesta múltiple, por lo que suman más de 100 %): paro 61,0 %, terrorismo de ETA 40,1 %, inseguridad ciudadana 21,2 %, vivienda 20,3 % e inmigración 12,9 %."
      fuentes:
        - medio: "CIS"
          titulo: "Barómetro de febrero 2004 (estudio 2556)"
          url: "https://www.cis.es/estudios/barometro-de-febrero-2004"
          tipo: institucion
    - titulo: Condiciones de vida en el primer dato de Eurostat (2004)
      descripcion: "En 2004, primer año de la serie, Eurostat estima que el 25,0 % de la población estaba en riesgo de pobreza o exclusión social (AROPE) y que el 11,7 % declaraba llegar a fin de mes «con mucha dificultad». Eurostat publica dos series de AROPE con metodologías distintas; aquí se usa la de 2004-2020."
      fuentes:
        - medio: "Eurostat"
          titulo: "Persons at risk of poverty or social exclusion by age and sex - EU 2020 strategy (ilc_peps01)"
          url: "https://ec.europa.eu/eurostat/databrowser/view/ilc_peps01/default/table?lang=en"
          tipo: institucion
        - medio: "Eurostat"
          titulo: "Inability to make ends meet (ilc_mdes09)"
          url: "https://ec.europa.eu/eurostat/databrowser/view/ilc_mdes09/default/table?lang=en"
          tipo: institucion
logros:
  - titulo: Ley de Partidos e ilegalización de Batasuna (2002-2003)
    descripcion: "La Ley Orgánica 6/2002 de Partidos Políticos, cuyo procedimiento pactaron PP y PSOE, permitió disolver partidos que apoyaran la violencia. En marzo de 2003 el Tribunal Supremo declaró por unanimidad ilegales Herri Batasuna, Euskal Herritarrok y Batasuna, y el Tribunal Europeo de Derechos Humanos avaló la medida en 2009."
    fuentes:
      - medio: "Última Hora (agencias)"
        titulo: "El Tribunal Supremo acuerda por unanimidad ilegalizar Batasuna"
        url: "https://www.ultimahora.es/noticias/nacional/2003/03/18/734235/el-tribunal-supremo-acuerda-por-unanimidad-ilegalizar-batasuna.html"
        tipo: prensa
        fecha: 2003-03-18
      - medio: "Revista de Derecho Comunitario Europeo (UGR)"
        titulo: "El TEDH avala la ilegalización de «Batasuna»"
        url: "https://www.ugr.es/~redce/REDCE13/articulos/14Virgala.htm"
        tipo: estudio
  - titulo: Entrada en el euro y déficit cero (1999-2003)
    descripcion: "Según CIDOB, España participó en el euro desde su primera fase, las cuentas públicas lograron el equilibrio y en 2003 el primer superávit de la democracia, y entre 1996 y 2003 se crearon 4,4 millones de empleos; la OCDE atribuyó el equilibrio en buena parte al aumento de afiliados a la Seguridad Social. Un análisis académico discute el enfoque del Gobierno sobre el déficit cero."
    fuentes:
      - medio: "CIDOB"
        titulo: "José María Aznar López"
        url: "https://www.cidob.org/lider-politico/jose-maria-aznar-lopez"
        tipo: estudio
      - medio: "Revista Fomento Social (Universidad Loyola)"
        titulo: "La economía española durante el gobierno de Aznar"
        url: "https://revistas.uloyola.es/rfs/article/download/2327/888/"
        tipo: estudio
criticas:
  - titulo: Apoyo a la invasión de Irak (2003)
    descripcion: "España apoyó políticamente la invasión de Irak de marzo de 2003 y participó en la cumbre de las Azores con Estados Unidos y Reino Unido. El argumento central era la posesión de armas de destrucción masiva por el régimen iraquí, que no se confirmó. La decisión sigue siendo objeto de debate político."
    fuentes:
      - medio: "Real Instituto Elcano"
        titulo: "ARI 49/2003: Cuestionario tras la cumbre de Azores"
        url: "https://www.realinstitutoelcano.org/wp-content/uploads/2021/12/ari-49-2003-e.pdf"
        tipo: estudio
        fecha: 2003-03-20
      - medio: "Público"
        titulo: "Aznar, veinte años sin rendir cuentas por la guerra de Irak"
        url: "https://www.publico.es/politica/aznar-veinte-anos-rendir-cuentas-guerra-irak.html"
        tipo: prensa
  - titulo: Gestión de la catástrofe del Prestige (2002)
    descripcion: "El petrolero Prestige se hundió frente a Galicia en noviembre de 2002. La plataforma Nunca Máis cuestionó la gestión de la crisis. En 2013 la Audiencia de A Coruña no apreció responsabilidad penal en los tres acusados y en 2016 el Tribunal Supremo condenó al capitán por un delito contra el medio ambiente y fijó indemnizaciones por más de 1.500 millones de euros."
    fuentes:
      - medio: "elDiario.es"
        titulo: "'Nunca Máis' decidirá esta semana si recurre la sentencia del Prestige ante el Supremo"
        url: "https://www.eldiario.es/politica/mais-decidira-sentencia-prestige-supremo_1_5169457.html"
        tipo: prensa
      - medio: "gCaptain"
        titulo: "Spain's Supreme Court Upholds 1.6 Billion Euro Prestige Oil Spill Ruling"
        url: "https://gcaptain.com/spains-supreme-court-upholds-1-6-billion-euro-prestige-oil-spill-rulingspains-supreme-court-upholds-1-6-billion-euro-prestige-oil-spill-ruling"
        tipo: prensa
  - titulo: Accidente del Yak-42 (2003)
    descripcion: "En mayo de 2003 murieron 62 militares españoles al estrellarse en Turquía el avión Yak-42 en que regresaban de Afganistán. El ministro de Defensa, Federico Trillo, pidió disculpas a las familias en 2004 por los errores en la identificación de los cadáveres, y un dictamen del Consejo de Estado de 2017 responsabilizó al Ministerio de Defensa del accidente."
    fuentes:
      - medio: "Última Hora (agencias)"
        titulo: "Trillo pide disculpas a las familias de las víctimas del Yak-42 por los errores cometidos"
        url: "https://www.ultimahora.es/noticias/nacional/2004/06/30/655875/trillo-pide-disculpas-a-las-familias-de-las-victimas-del-yak-42-por-los-errores-cometidos.html"
        tipo: prensa
        fecha: 2004-06-30
      - medio: "Público"
        titulo: "Cronología del caso del Yak"
        url: "https://www.publico.es/espana/cronologia-del-caso-del-yak.html"
        tipo: prensa
