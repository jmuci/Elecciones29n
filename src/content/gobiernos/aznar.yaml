resumen: "El PP gobernó con apoyos parlamentarios entre 1996 y 2000 y con mayoría absoluta (183 escaños) desde las elecciones de marzo de 2000 hasta las de marzo de 2004. La línea de tiempo muestra solo el periodo posterior a 2000."
