presidente: Mariano Rajoy
partido: pp
bloque: derecha
inicio: 2011-12-21
fin: 2018-06-02
orden: 3
resumen: "El PP obtuvo mayoría absoluta en las elecciones de noviembre de 2011 y gobernó en minoría tras las de 2015 y 2016. El Gobierno terminó con la moción de censura de junio de 2018, presentada tras conocerse la sentencia de la primera época de la trama Gürtel."
