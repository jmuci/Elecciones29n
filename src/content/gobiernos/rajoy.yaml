presidente: Mariano Rajoy
partido: pp
bloque: derecha
inicio: 2011-12-21
fin: 2018-06-02
orden: 3
resumen: "El PP obtuvo mayoría absoluta en las elecciones de noviembre de 2011 y gobernó en minoría tras las de 2015 y 2016. El Gobierno terminó con la moción de censura de junio de 2018, presentada tras conocerse la sentencia de la primera época de la trama Gürtel."
destacados:
  - nombre: "Soraya Sáenz de Santamaría"
    cargo: "Vicepresidenta y portavoz del Gobierno"
  - nombre: "Cristóbal Montoro"
    cargo: "Ministro de Hacienda"
  - nombre: "Luis de Guindos"
    cargo: "Ministro de Economía"
  - nombre: "José Manuel García-Margallo"
    cargo: "Ministro de Asuntos Exteriores (2011-2016)"
  - nombre: "Jorge Fernández Díaz"
    cargo: "Ministro del Interior (2011-2016)"
  - nombre: "María Dolores de Cospedal"
    cargo: "Ministra de Defensa (2016-2018)"
nota_revision: "Primera pasada: de momento hay menos logros que críticas documentados con fuente. No es una valoración; se buscan más fuentes para los logros."
revisado: 2026-11-02
contexto:
  internacional:
    - titulo: Crisis del euro y «whatever it takes» (2012)
      descripcion: "El 26 de julio de 2012, en plena crisis de deuda de la zona euro, el presidente del BCE, Mario Draghi, afirmó que el BCE estaba dispuesto a hacer «whatever it takes» para preservar el euro dentro de su mandato."
      fuentes:
        - medio: "Banco Central Europeo"
          titulo: "Verbatim of the remarks made by Mario Draghi"
          url: "https://www.ecb.europa.eu/press/key/date/2012/html/sp120726.en.html"
          tipo: institucion
          fecha: 2012-07-26
    - titulo: Asistencia financiera europea a la banca (2012-2014)
      descripcion: "En 2012 España recurrió a una línea de asistencia financiera europea para recapitalizar parte de su sector bancario. Según las fuentes citadas en Logros, se usaron 41.300 de los 100.000 millones de euros previstos y el programa concluyó sin prórroga ni línea preventiva de crédito. El Mecanismo Europeo de Estabilidad mantiene vigilancia posterior al programa."
      fuentes:
        - medio: "Mecanismo Europeo de Estabilidad"
          titulo: "Spain"
          url: "https://www.esm.europa.eu/assistance/spain"
          tipo: institucion
        - medio: "Público"
          titulo: "El fondo de rescate de la UE da por concluido con éxito el plan de ayuda a los bancos españoles"
          url: "https://www.publico.es/actualidad/fondo-rescate-ue-da-concluido-exitoso-plan-ayuda-bancos-espanoles.html"
          tipo: prensa
    - titulo: Referéndum del Brexit (2016)
      descripcion: "El 23 de junio de 2016 el Reino Unido votó salir de la Unión Europea. Según el Real Instituto Elcano, España es uno de los países con más que perder por los vínculos económicos y humanos con el Reino Unido (comercio, inversión y turismo). El Banco de España analizó la exposición comercial y financiera de la economía española al Reino Unido."
      fuentes:
        - medio: "Real Instituto Elcano"
          titulo: "The consequences of Brexit for Spain"
          url: "https://www.realinstitutoelcano.org/en/analyses/the-consequences-of-brexit-for-spain/"
          tipo: estudio
        - medio: "Banco de España"
          titulo: "Brexit: balance de situación y perspectivas (Documento Ocasional 1905)"
          url: "https://www.bde.es/f/webbde/SES/Secciones/Publicaciones/PublicacionesSeriadas/DocumentosOcasionales/19/Fich/do1905.pdf"
          tipo: institucion
  economia_global:
    - titulo: Compra de activos del BCE (desde 2015)
      descripcion: "El 22 de enero de 2015 el BCE anunció un programa ampliado de compra de activos, con compras mensuales combinadas de 60.000 millones de euros, previstas al menos hasta septiembre de 2016."
      fuentes:
        - medio: "Banco Central Europeo"
          titulo: "ECB announces expanded asset purchase programme"
          url: "https://www.ecb.europa.eu/press/pr/date/2015/html/pr150122_1.en.html"
          tipo: institucion
          fecha: 2015-01-22
    - titulo: Tipos de interés del BCE (2011-2016)
      descripcion: "Según el BCE, el tipo de las operaciones principales de financiación pasó del 1,00 % (diciembre de 2011) al 0,75 % (julio de 2012), al 0,25 % (noviembre de 2013), al 0,05 % (septiembre de 2014) y al 0,00 % (marzo de 2016), con el tipo de la facilidad de depósito en −0,40 %."
      fuentes:
        - medio: "Banco Central Europeo"
          titulo: "Official interest rates"
          url: "https://www.ecb.europa.eu/stats/policy_and_exchange_rates/key_ecb_interest_rates/html/index.en.html"
          tipo: institucion
economia:
  macro:
    - titulo: Crecimiento e inflación (2011-2018)
      descripcion: "PIB real por años (Eurostat): 2011, −0,6 % (el Gobierno empezó en diciembre); 2012, −2,9 %; 2013, −1,4 %; 2014, 1,5 %; 2015, 4,1 %; 2016, 2,9 %; 2017, 2,9 %; 2018, 2,4 % (el Gobierno terminó en junio). La inflación media (IPCA) fue del 2,4 % en 2012 y del 1,5 % en 2013, negativa en 2014, 2015 y 2016 (−0,2 %, −0,6 % y −0,3 %) y del 2,0 % en 2017."
      fuentes:
        - medio: "Eurostat"
          titulo: "Gross domestic product (GDP) and main components - annual data (nama_10_gdp)"
          url: "https://ec.europa.eu/eurostat/databrowser/view/nama_10_gdp/default/table?lang=en"
          tipo: institucion
        - medio: "Eurostat"
          titulo: "HICP - annual data (prc_hicp_aind)"
          url: "https://ec.europa.eu/eurostat/databrowser/view/prc_hicp_aind/default/table?lang=en"
          tipo: institucion
    - titulo: Paro (2011-2018)
      descripcion: "La tasa de paro (Eurostat, población de 15 a 74 años) fue del 21,4 % en 2011, subió al 24,8 % en 2012 y al 26,1 % en 2013, y bajó después al 24,5 % (2014), 22,1 % (2015), 19,6 % (2016), 17,2 % (2017) y 15,3 % (2018). La serie tiene cambios metodológicos de la Encuesta de Población Activa, por lo que los saltos entre años concretos deben leerse con cautela."
      fuentes:
        - medio: "Eurostat"
          titulo: "Unemployment rates by citizenship (lfsa_urgan)"
          url: "https://ec.europa.eu/eurostat/databrowser/view/lfsa_urgan/default/table?lang=en"
          tipo: institucion
    - titulo: Saldo y deuda de las administraciones públicas
      descripcion: "Según Eurostat, el saldo fue del −9,7 % del PIB en 2011, del −11,5 % en 2012 y del −3,1 % en 2017. La deuda pasó del 69,5 % del PIB en 2011 al 89,6 % en 2012, al 100,0 % en 2013 y al 101,2 % en 2017."
      fuentes:
        - medio: "Eurostat"
          titulo: "Government deficit/surplus, debt and associated data (gov_10dd_edpt1)"
          url: "https://ec.europa.eu/eurostat/databrowser/view/gov_10dd_edpt1/default/table?lang=en"
          tipo: institucion
    - titulo: "Otras métricas: PIB por habitante, empleo y saldo exterior (2011-2018)"
      descripcion: "PIB real por habitante (variación anual): 2012, −2,9 %; 2013, −1,1 %; 2014, 1,8 %; 2015, 4,2 %; 2016, 2,8 %; 2017, 2,7 %; 2018, 1,9 %. Tasa de empleo: 62,0 % en 2011, 58,6 % en 2013 y 67,0 % en 2018. Paro juvenil: 46,2 %, 55,5 % y 34,3 %. Saldo exterior: −2,6 % del PIB en 2011, 2,1 % en 2013 y 1,9 % en 2018. Son datos anuales de Eurostat: la tasa de empleo es la de 20 a 64 años, el paro juvenil el de menores de 25 años y el saldo exterior la balanza por cuenta corriente en porcentaje del PIB."
      fuentes:
        - medio: "Eurostat"
          titulo: "GDP and main components per capita - annual data (nama_10_pc)"
          url: "https://ec.europa.eu/eurostat/databrowser/view/nama_10_pc/default/table?lang=en"
          tipo: institucion
        - medio: "Eurostat"
          titulo: "Employment rates by citizenship (lfsa_ergan)"
          url: "https://ec.europa.eu/eurostat/databrowser/view/lfsa_ergan/default/table?lang=en"
          tipo: institucion
        - medio: "Eurostat"
          titulo: "Unemployment rates by citizenship (lfsa_urgan)"
          url: "https://ec.europa.eu/eurostat/databrowser/view/lfsa_urgan/default/table?lang=en"
          tipo: institucion
        - medio: "Eurostat"
          titulo: "Current account balance - annual data (tipsbp20)"
          url: "https://ec.europa.eu/eurostat/databrowser/view/tipsbp20/default/table?lang=en"
          tipo: institucion
  percepcion:
    - titulo: Valoración de la economía en el CIS (2014 y 2018)
      descripcion: "En febrero de 2014 el 0,7 % calificó de buena la situación económica general de España, el 12,1 % de regular y el 86,9 % de mala o muy mala. En junio de 2018, mes en que terminó el Gobierno, el 6,7 % la calificó de buena o muy buena, el 42,5 % de regular y el 49,7 % de mala o muy mala."
      fuentes:
        - medio: "CIS"
          titulo: "Barómetro de febrero 2014 (estudio 3013)"
          url: "https://www.cis.es/estudios/barometro-de-febrero-2014"
          tipo: institucion
        - medio: "CIS"
          titulo: "Barómetro de junio 2018 (estudio 3217)"
          url: "https://www.cis.es/estudios/barometro-de-junio-2018"
          tipo: institucion
    - titulo: Principales problemas del país según el CIS (2014 y 2018)
      descripcion: "Como primer problema, en febrero de 2014 el paro fue citado por el 56,3 % (81,1 % sumando las tres respuestas) y la corrupción y el fraude por el 15,3 % (44,2 % en total). En junio de 2018, el paro por el 37,1 % (62,4 % en total) y la corrupción y el fraude por el 18,1 % (39,2 % en total)."
      fuentes:
        - medio: "CIS"
          titulo: "Barómetro de febrero 2014 (estudio 3013)"
          url: "https://www.cis.es/estudios/barometro-de-febrero-2014"
          tipo: institucion
        - medio: "CIS"
          titulo: "Barómetro de junio 2018 (estudio 3217)"
          url: "https://www.cis.es/estudios/barometro-de-junio-2018"
          tipo: institucion
    - titulo: Condiciones de vida y vivienda (2012-2018)
      descripcion: "Según Eurostat, el riesgo de pobreza o exclusión social (AROPE) llegó al 29,2 % en 2014 (máximo de la serie 2004-2020) y fue del 26,1 % en 2018. El porcentaje que declaraba llegar a fin de mes «con mucha dificultad» fue del 18,6 % en 2013 y del 10,4 % en 2018. El precio de la vivienda varió un −14,8 % en 2012 y un −9,1 % en 2013, y subió un 6,7 % en 2018."
      fuentes:
        - medio: "Eurostat"
          titulo: "Persons at risk of poverty or social exclusion by age and sex - EU 2020 strategy (ilc_peps01)"
          url: "https://ec.europa.eu/eurostat/databrowser/view/ilc_peps01/default/table?lang=en"
          tipo: institucion
        - medio: "Eurostat"
          titulo: "Inability to make ends meet (ilc_mdes09)"
          url: "https://ec.europa.eu/eurostat/databrowser/view/ilc_mdes09/default/table?lang=en"
          tipo: institucion
        - medio: "Eurostat"
          titulo: "House price index - annual data (prc_hpi_a)"
          url: "https://ec.europa.eu/eurostat/databrowser/view/prc_hpi_a/default/table?lang=en"
          tipo: institucion
logros:
  - titulo: Salida de la recesión y crecimiento (2013-2015)
    descripcion: "El Gobierno situó la salida de la recesión a finales de 2013 (el PIB creció un 0,3 % en el cuarto trimestre), cifró el crecimiento de 2014 en el 1,4 % y estimó el de 2015 en el 3,2 %, con unos 600.000 empleos creados ese año. Son cifras del propio Ejecutivo; la calidad del empleo creado fue discutida."
    fuentes:
      - medio: "La Moncloa"
        titulo: "Balance de 2014: España ha conseguido superar la peor etapa de la crisis"
        url: "https://www.lamoncloa.gob.es/presidente/actividades/Paginas/2014/261214balance.aspx"
        tipo: institucion
        fecha: 2014-12-26
      - medio: "Periódico de Ibiza (agencias)"
        titulo: "La economía española cerrará 2015 con un crecimiento del 3,2 %, según el Gobierno"
        url: "https://www.periodicodeibiza.es/noticias/nacional/2015/12/29/170867/economia-espanola-cerrara-2015-crecimiento-del-segun-gobierno.html"
        tipo: prensa
        fecha: 2015-12-29
  - titulo: Salida del programa de asistencia financiera a la banca (2013-2014)
    descripcion: "España usó 41.300 millones de los 100.000 millones de euros de la línea europea para reestructurar su banca y salió del programa sin prórroga ni línea preventiva de crédito. El fondo europeo lo consideró un plan exitoso, y España ha devuelto más del 75 % del préstamo, según Público."
    fuentes:
      - medio: "Público"
        titulo: "El fondo de rescate de la UE da por concluido con éxito el plan de ayuda a los bancos españoles"
        url: "https://www.publico.es/actualidad/fondo-rescate-ue-da-concluido-exitoso-plan-ayuda-bancos-espanoles.html"
        tipo: prensa
      - medio: "Público"
        titulo: "Adiós a los 'hombres de negro': España ya ha devuelto más del 75 % del rescate de la banca"
        url: "https://www.publico.es/economia/adios-hombres-negro-espana-devuelto-75-rescate-banca.amp.html"
        tipo: prensa
criticas:
  - titulo: Subida del IRPF pese a la promesa electoral (2011)
    descripcion: "Durante la campaña de 2011 el PP afirmó que no subiría impuestos. El 30 de diciembre de 2011 el Gobierno aprobó un recargo temporal en el IRPF y subió el IBI, que atribuyó al déficit público más alto de lo previsto heredado del Gobierno anterior."
    fuentes:
      - medio: "Público"
        titulo: "Rajoy incumple su palabra y sube los impuestos"
        url: "https://www.publico.es/actualidad/rajoy-incumple-palabra-sube-impuestos.html"
        tipo: prensa
      - medio: "Noticias de Navarra"
        titulo: "Rajoy ha subido todos los impuestos desde que llegó a la Moncloa hace cinco años"
        url: "https://www.noticiasdenavarra.com/actualidad/2017/01/08/rajoy-subido-impuestos-llego-moncloa-2690640.html"
        tipo: prensa
        fecha: 2017-01-08
  - titulo: Sentencia de la trama Gürtel y condena al PP (2018-2020)
    descripcion: "La Audiencia Nacional condenó en mayo de 2018 a Francisco Correa a 51 años de prisión y a Luis Bárcenas, extesorero del PP, a 33, y al PP como partícipe a título lucrativo. El Tribunal Supremo confirmó la sentencia en octubre de 2020, rebajó las penas de Bárcenas a 29 años y 1 mes y eliminó las alusiones a una «caja B» del partido. Ver el detalle en la sección de corrupción."
    fuentes:
      - medio: "Diari de Tarragona (agencias)"
        titulo: "Sentencia del Caso Gürtel: 51 años para Correa y 33 para Bárcenas"
        url: "https://www.diaridetarragona.com/espana/144829/sentencia-del-caso-gurtel-51-anos-para-correa-y-33-para-barcenas-20180524-0020-ysdt201805240020.html"
        tipo: prensa
        fecha: 2018-05-24
      - medio: "Público"
        titulo: "El Supremo confirma la condena al PP por beneficiarse de la Gürtel"
        url: "https://www.publico.es/politica/supremo-confirma-condena-al-pp-guertel.html"
        tipo: prensa
        fecha: 2020-10-14
  - titulo: Ley de Seguridad Ciudadana («ley mordaza», 2015)
    descripcion: "La ley, aprobada por el Congreso en diciembre de 2014 y en vigor en 2015, fue criticada por Amnistía Internacional, el Comité de Derechos Humanos de la ONU y la Comisión de Venecia por su efecto sobre la libertad de expresión y de reunión. Sigue en vigor: su reforma, prometida por el PSOE, está bloqueada en el Congreso."
    fuentes:
      - medio: "Amnistía Internacional"
        titulo: "Ley Mordaza: diez años de vulneraciones de derechos humanos y promesas incumplidas"
        url: "https://www.es.amnesty.org/en-que-estamos/noticias/noticia/articulo/ley-mordaza-diez-anos-de-vulneraciones-de-derechos-humanos-y-promesas-incumplidas/"
        tipo: organizacion
      - medio: "LegalToday (Reuters)"
        titulo: "El Congreso aprueba la polémica Ley de Seguridad Ciudadana"
        url: "https://www.legaltoday.com/rincon-de-reuters/el-congreso-aprueba-la-polemica-ley-de-seguridad-ciudadana-2014-12-12/"
        tipo: prensa
        fecha: 2014-12-12
