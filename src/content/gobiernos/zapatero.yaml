presidente: José Luis Rodríguez Zapatero
partido: psoe
bloque: izquierda
inicio: 2004-04-17
fin: 2011-12-21
orden: 2
resumen: "El PSOE ganó las elecciones de marzo de 2004 y de marzo de 2008 y gobernó en minoría, con apoyos parlamentarios variables. El periodo incluye el inicio de la crisis financiera de 2008."
