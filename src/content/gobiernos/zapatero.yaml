presidente: José Luis Rodríguez Zapatero
partido: psoe
bloque: izquierda
inicio: 2004-04-17
fin: 2011-12-21
orden: 2
resumen: "El PSOE ganó las elecciones de marzo de 2004 y de marzo de 2008 y gobernó en minoría, con apoyos parlamentarios variables. El periodo incluye el inicio de la crisis financiera de 2008."
destacados:
  - nombre: "María Teresa Fernández de la Vega"
    cargo: "Vicepresidenta primera y portavoz del Gobierno"
  - nombre: "Pedro Solbes"
    cargo: "Vicepresidente segundo y ministro de Economía"
  - nombre: "Alfredo Pérez Rubalcaba"
    cargo: "Ministro del Interior y vicepresidente primero"
  - nombre: "Miguel Ángel Moratinos"
    cargo: "Ministro de Asuntos Exteriores"
  - nombre: "Elena Salgado"
    cargo: "Vicepresidenta segunda y ministra de Economía"
  - nombre: "Carme Chacón"
    cargo: "Ministra de Vivienda y de Defensa"
cifras:
  desde: 2004
  hasta: 2011
revisado: 2026-11-04
contexto:
  internacional:
    - titulo: Crisis financiera internacional (2007-2009)
      descripcion: "Según el Banco de España, la quiebra de Lehman Brothers y el episodio de AIG (septiembre de 2008) agravaron la incertidumbre y la crisis de confianza a escala mundial. El propio informe sitúa el inicio del ajuste inmobiliario español a mediados de 2006: el número de viviendas iniciadas bajó de 760.000 en 2006 a 360.000 en 2008, y las transacciones de 955.000 a 565.000. El Banco de España describe la crisis internacional como un choque superpuesto a un ajuste interno que ya había empezado."
      fuentes:
        - medio: "Banco de España"
          titulo: "Informe Anual 2008, capítulo 2: El impacto de la crisis financiera sobre la economía española"
          url: "https://www.bde.es/f/webbde/SES/Secciones/Publicaciones/PublicacionesAnuales/InformesAnuales/08/cap2.pdf"
          tipo: institucion
    - titulo: Crisis de deuda soberana en la zona euro (2010-2011)
      descripcion: "El 10 de mayo de 2010 el BCE aprobó varias medidas ante las «severas tensiones» en algunos segmentos de mercado, entre ellas intervenciones en los mercados de deuda pública y privada de la zona euro (Programa para los Mercados de Valores). Los recortes del Gobierno español de mayo de 2010 (ver Críticas) se produjeron en ese contexto."
      fuentes:
        - medio: "Banco Central Europeo"
          titulo: "ECB decides on measures to address severe tensions in financial markets"
          url: "https://www.ecb.europa.eu/press/pr/date/2010/html/pr100510.en.html"
          tipo: institucion
          fecha: 2010-05-10
  economia_global:
    - titulo: Recesión mundial de 2009
      descripcion: "El FMI estimó en enero de 2010 que la producción mundial se contrajo un 0,8 % en 2009 y la de las economías avanzadas un 3,2 %, con una recuperación desigual y todavía apoyada en estímulos públicos."
      fuentes:
        - medio: "FMI"
          titulo: "World Economic Outlook Update: A Policy-Driven, Multispeed Recovery"
          url: "https://www.imf.org/external/pubs/ft/weo/2010/update/01/"
          tipo: institucion
          fecha: 2010-01-26
    - titulo: Tipos de interés del BCE (2007-2009)
      descripcion: "Según el BCE, el tipo de las operaciones principales de financiación fue del 4,00 % en junio de 2007 y bajó hasta el 1,00 % en mayo de 2009. Es el tipo de referencia de toda la zona euro, no solo de España."
      fuentes:
        - medio: "Banco Central Europeo"
          titulo: "Official interest rates"
          url: "https://www.ecb.europa.eu/stats/policy_and_exchange_rates/key_ecb_interest_rates/html/index.en.html"
          tipo: institucion
economia:
  macro:
    - titulo: Crecimiento e inflación (2004-2011)
      descripcion: "PIB real por años (Eurostat): 2004, 3,1 %; 2005, 3,6 %; 2006, 4,0 %; 2007, 3,5 %; 2008, 0,8 %; 2009, −3,8 %; 2010, 0,1 %; 2011, −0,6 %. La inflación media (IPCA) fue del 2,8 % en 2007, del 4,1 % en 2008 y del −0,2 % en 2009."
      fuentes:
        - medio: "Eurostat"
          titulo: "Gross domestic product (GDP) and main components - annual data (nama_10_gdp)"
          url: "https://ec.europa.eu/eurostat/databrowser/view/nama_10_gdp/default/table?lang=en"
          tipo: institucion
        - medio: "Eurostat"
          titulo: "HICP - annual data (prc_hicp_aind)"
          url: "https://ec.europa.eu/eurostat/databrowser/view/prc_hicp_aind/default/table?lang=en"
          tipo: institucion
    - titulo: Paro (2004-2011)
      descripcion: "La tasa de paro (Eurostat, población de 15 a 74 años) fue del 11,1 % en 2004, bajó al 8,2 % en 2007 y subió al 11,3 % en 2008, al 17,9 % en 2009, al 19,9 % en 2010 y al 21,4 % en 2011. La serie tiene cambios metodológicos de la Encuesta de Población Activa, por lo que los saltos entre años concretos deben leerse con cautela."
      fuentes:
        - medio: "Eurostat"
          titulo: "Unemployment rates by citizenship (lfsa_urgan)"
          url: "https://ec.europa.eu/eurostat/databrowser/view/lfsa_urgan/default/table?lang=en"
          tipo: institucion
    - titulo: Saldo y deuda de las administraciones públicas
      descripcion: "Según Eurostat, el saldo fue positivo entre 2005 y 2007 (1,2 %, 2,1 % y 1,9 % del PIB) y negativo desde 2008: −4,6 %, −11,2 % en 2009 y −9,7 % en 2011. La deuda pasó del 45,3 % del PIB en 2004 al 35,7 % en 2007 y al 69,5 % en 2011."
      fuentes:
        - medio: "Eurostat"
          titulo: "Government deficit/surplus, debt and associated data (gov_10dd_edpt1)"
          url: "https://ec.europa.eu/eurostat/databrowser/view/gov_10dd_edpt1/default/table?lang=en"
          tipo: institucion
    - titulo: "Otras métricas: PIB por habitante, empleo y saldo exterior (2004-2011)"
      descripcion: "PIB real por habitante (variación anual): 2004, 1,5 %; 2005, 1,6 %; 2006, 2,4 %; 2007, 1,5 %; 2008, −0,9 %; 2009, −4,6 %; 2010, −0,3 %; 2011, −1,0 %. Tasa de empleo: 65,2 % en 2004, 69,7 % en 2007 y 62,0 % en 2011. Paro juvenil: 22,5 %, 18,1 % y 46,2 %. Saldo exterior: −5,4 % del PIB en 2004, −9,4 % en 2007 y −2,6 % en 2011. Son datos anuales de Eurostat: la tasa de empleo es la de 20 a 64 años, el paro juvenil el de menores de 25 años y el saldo exterior la balanza por cuenta corriente en porcentaje del PIB."
      fuentes:
        - medio: "Eurostat"
          titulo: "GDP and main components per capita - annual data (nama_10_pc)"
          url: "https://ec.europa.eu/eurostat/databrowser/view/nama_10_pc/default/table?lang=en"
          tipo: institucion
        - medio: "Eurostat"
          titulo: "Employment rates by citizenship (lfsa_ergan)"
          url: "https://ec.europa.eu/eurostat/databrowser/view/lfsa_ergan/default/table?lang=en"
          tipo: institucion
        - medio: "Eurostat"
          titulo: "Unemployment rates by citizenship (lfsa_urgan)"
          url: "https://ec.europa.eu/eurostat/databrowser/view/lfsa_urgan/default/table?lang=en"
          tipo: institucion
        - medio: "Eurostat"
          titulo: "Current account balance - annual data (tipsbp20)"
          url: "https://ec.europa.eu/eurostat/databrowser/view/tipsbp20/default/table?lang=en"
          tipo: institucion
  percepcion:
    - titulo: Valoración de la economía en el CIS (mayo de 2009)
      descripcion: "Preguntados por la situación económica general de España, el 3,1 % la calificó de buena o muy buena, el 25,6 % de regular y el 70,5 % de mala o muy mala."
      fuentes:
        - medio: "CIS"
          titulo: "Barómetro de mayo 2009 (estudio 2801)"
          url: "https://www.cis.es/estudios/barometro-de-mayo-2009"
          tipo: institucion
    - titulo: Principales problemas del país según el CIS (mayo de 2009)
      descripcion: "Como primer problema, el paro fue citado por el 55,7 % (77,3 % sumando las tres respuestas) y los problemas de índole económica por el 22,7 % (48,7 % en total). La vivienda fue primer problema para el 1,4 % (13,0 % en total); en febrero de 2004 el 20,3 % la había citado entre los tres principales."
      fuentes:
        - medio: "CIS"
          titulo: "Barómetro de mayo 2009 (estudio 2801)"
          url: "https://www.cis.es/estudios/barometro-de-mayo-2009"
          tipo: institucion
    - titulo: Condiciones de vida y vivienda (2007-2011)
      descripcion: "Según Eurostat, el riesgo de pobreza o exclusión social (AROPE) pasó del 23,3 % en 2007 al 26,7 % en 2011, y el porcentaje que declaraba llegar a fin de mes «con mucha dificultad» del 11,1 % en 2007 al 16,2 % en 2009 y al 15,5 % en 2010. El precio de la vivienda subió de media un 9,8 % en 2007 y cayó un 1,4 % en 2008, un 6,6 % en 2009 y un 7,6 % en 2011."
      fuentes:
        - medio: "Eurostat"
          titulo: "Persons at risk of poverty or social exclusion by age and sex - EU 2020 strategy (ilc_peps01)"
          url: "https://ec.europa.eu/eurostat/databrowser/view/ilc_peps01/default/table?lang=en"
          tipo: institucion
        - medio: "Eurostat"
          titulo: "Inability to make ends meet (ilc_mdes09)"
          url: "https://ec.europa.eu/eurostat/databrowser/view/ilc_mdes09/default/table?lang=en"
          tipo: institucion
        - medio: "Eurostat"
          titulo: "House price index - annual data (prc_hpi_a)"
          url: "https://ec.europa.eu/eurostat/databrowser/view/prc_hpi_a/default/table?lang=en"
          tipo: institucion
logros:
  - titulo: Matrimonio entre personas del mismo sexo (2005)
    descripcion: "La Ley 13/2005 reconoció el derecho a contraer matrimonio a las parejas del mismo sexo. El Congreso la aprobó definitivamente el 30 de junio de 2005 con 187 votos a favor, 147 en contra y 4 abstenciones, tras el veto del Senado. El PP votó en contra."
    fuentes:
      - medio: "Cooperativa.cl"
        titulo: "Congreso español aprobó, definitivamente, el matrimonio homosexual"
        url: "https://cooperativa.cl/noticias/sociedad/homosexualidad/congreso-espanol-aprobo-definitivamente-el-matrimonio-homosex/2005-06-30/061652.html"
        tipo: prensa
        fecha: 2005-06-30
      - medio: "The Objective"
        titulo: "El matrimonio igualitario cumple 15 años tras unir a más de 55.000 parejas"
        url: "https://theobjective.com/sociedad/2020-06-30/el-matrimonio-igualitario-cumple-15-anos-tras-unir-a-mas-de-55-000-parejas/"
        tipo: prensa
        fecha: 2020-06-30
  - titulo: Ley de Dependencia (2006)
    descripcion: "La Ley 39/2006 creó el derecho a recibir atención para las personas en situación de dependencia. Según la Asociación de Directores y Gerentes de Servicios Sociales, citada por Menorca.info en 2025, se ha atendido a casi cuatro millones de personas desde entonces, aunque casi un millón falleció en lista de espera; la lista de espera tuvo su máximo en 2015, con 384.326 personas."
    fuentes:
      - medio: "Menorca.info"
        titulo: "La dependencia en España: más personas atendidas, pero con un sistema «low cost» que se consolida"
        url: "https://www.menorca.info/actualidad/nacional/2025/03/01/2336673/dependencia-espana-mas-personas-atendidas-pero-sistema-low-cost-consolida.html"
        tipo: prensa
        fecha: 2025-03-01
      - medio: "El Derecho"
        titulo: "El año 2015 se cerró con 384.326 personas en lista de espera para recibir atención por dependencia"
        url: "https://elderecho.com/el-ano-2015-se-cerro-con-384-326-personas-en-lista-de-espera-para-recibir-atencion-por-dependencia"
        tipo: prensa
  - titulo: Fin de la actividad armada de ETA (2011)
    descripcion: "El 20 de octubre de 2011 ETA anunció el cese definitivo de su actividad armada; no se disolvió hasta 2018. Zapatero destacó la acción de las Fuerzas y Cuerpos de Seguridad del Estado. Cuánto contribuyó el Gobierno a ese desenlace es objeto de debate: un artículo de opinión de 2026 sostiene que no fue quien más contribuyó."
    fuentes:
      - medio: "Público"
        titulo: "ETA anuncia el cese definitivo de su actividad"
        url: "https://www.publico.es/espana/eta-anuncia-cese-definitivo-actividad.html"
        tipo: prensa
        fecha: 2011-10-20
      - medio: "The Objective"
        titulo: "Lo siento, pero Zapatero no acabó con ETA, ni fue el que más contribuyó a su final"
        url: "https://theobjective.com/opinion/2026-05-23/siento-zapatero-no-eta-contribuyo-final/"
        tipo: opinion
        fecha: 2026-05-23
criticas:
  - titulo: Recortes de mayo de 2010
    descripcion: "El 12 de mayo de 2010 Zapatero anunció una rebaja media del 5 % en las retribuciones del sector público, la suspensión de la revalorización de las pensiones en 2011 (salvo mínimas y no contributivas) y un recorte de inversión. Una semana antes había rechazado acelerar la reducción del déficit. El decreto salió adelante en el Congreso por un voto de diferencia."
    fuentes:
      - medio: "LegalToday (Reuters)"
        titulo: "Zapatero anuncia un duro recorte de gasto social e inversiones"
        url: "https://www.legaltoday.com/rincon-de-reuters/zapatero-anuncia-un-duro-recorte-de-gasto-social-e-inversiones-2010-05-13/"
        tipo: prensa
        fecha: 2010-05-13
  - titulo: Paro al final de la legislatura (2011)
    descripcion: "La Encuesta de Población Activa del cuarto trimestre de 2011 contabilizó 5.273.600 parados y una tasa de paro del 22,85 %, la más alta de los países industrializados según la cadena irlandesa RTÉ. Los datos se publicaron en enero de 2012, con el Gobierno ya en funciones."
    fuentes:
      - medio: "La Moncloa (Ministerio de Economía)"
        titulo: "Datos de la Encuesta de Población Activa (EPA) del cuarto trimestre de 2011"
        url: "https://www.lamoncloa.gob.es/serviciosdeprensa/notasprensa/mineco/paginas/2012/270112EPA.aspx"
        tipo: institucion
        fecha: 2012-01-27
      - medio: "LegalToday (Reuters)"
        titulo: "España cierra 2011 con un récord de 5,27 millones de parados"
        url: "https://www.legaltoday.com/rincon-de-reuters/espana-cierra-2011-con-un-record-de-527-millones-de-parados-2012-01-27/"
        tipo: prensa
        fecha: 2012-01-27
  - titulo: Proceso de diálogo con ETA y atentado de la T4 (2006)
    descripcion: "Tras el alto el fuego de ETA de marzo de 2006, el Gobierno abrió un proceso de diálogo. El 30 de diciembre de 2006 ETA hizo estallar un coche bomba en la T4 de Barajas, con dos muertos, y el Gobierno suspendió las iniciativas de diálogo. El PP pidió una declaración formal de ruptura de la negociación."
    fuentes:
      - medio: "RTVC"
        titulo: "15 años del atentado de ETA en la T4"
        url: "https://rtvc.es/15-anos-del-atentado-de-eta-en-la-t4/"
        tipo: prensa
        fecha: 2021-12-30
      - medio: "Minuto Uno (EFE)"
        titulo: "Se rompe el acuerdo de paz con los terroristas"
        url: "https://www.minutouno.com/mundo/se-rompe-el-acuerdo-paz-los-terroristas-n8073"
        tipo: prensa
        fecha: 2006-12-30
