a_favor:
  - titulo: "Uno de los países con menos homicidios de la UE"
    descripcion: "En 2023 se registraron 3.930 homicidios intencionados en toda la UE. España está entre los países de la Unión con menor tasa de homicidios por habitante."
    fuentes:
      - medio: "Eurostat"
        titulo: "3 930 intentional homicides recorded in the EU in 2023"
        url: "https://ec.europa.eu/eurostat/en/web/products-eurostat-news/w/ddn-20250423-1"
        tipo: institucion
        fecha: 2025-04-23
      - medio: "El Orden Mundial"
        titulo: "La tasa de homicidios en la UE: España, uno de los países más seguros"
        url: "https://elordenmundial.com/mapas-y-graficos/tasa-homicidios-ue/"
        tipo: prensa
  - titulo: "Bajan los delitos contra el patrimonio"
    descripcion: "Los delitos contra el patrimonio, que suponen el 40,3 % de la criminalidad convencional, bajaron un 3,6 % en el primer semestre de 2026."
    fuentes:
      - medio: "Diario de León (Europa Press)"
        titulo: "La criminalidad aumenta un 0,5% por las agresiones sexuales"
        url: "https://www.diariodeleon.es/nacional/260918/2097733/criminalidad-aumenta-0-5-agresiones-sexuales.html"
        tipo: prensa
        fecha: 2026-09-18
en_contra:
  - titulo: "Suben los delitos sexuales y la cibercriminalidad"
    descripcion: "Los delitos contra la libertad sexual (+4 %) son los que más crecen. La cibercriminalidad se mantiene en máximos y es más difícil de investigar y de esclarecer."
    fuentes:
      - medio: "Diario de León (Europa Press)"
        titulo: "La criminalidad aumenta un 0,5% por las agresiones sexuales"
        url: "https://www.diariodeleon.es/nacional/260918/2097733/criminalidad-aumenta-0-5-agresiones-sexuales.html"
        tipo: prensa
        fecha: 2026-09-18
  - titulo: "Grandes diferencias entre territorios"
    descripcion: "La evolución no es igual en todas partes: en el primer semestre de 2026 la criminalidad bajó en Cataluña y Aragón fue la comunidad donde más aumentó."
    fuentes:
      - medio: "Diario de León (Europa Press)"
        titulo: "La criminalidad aumenta un 0,5% por las agresiones sexuales"
        url: "https://www.diariodeleon.es/nacional/260918/2097733/criminalidad-aumenta-0-5-agresiones-sexuales.html"
        tipo: prensa
        fecha: 2026-09-18
internacional:
  - titulo: "Tendencia europea a la baja en homicidios"
    descripcion: "Eurostat registró 3.930 homicidios intencionados en la UE en 2023, un 1,5 % más que en 2022, dentro de una tendencia de largo plazo a la baja."
    fuentes:
      - medio: "Eurostat"
        titulo: "3 930 intentional homicides recorded in the EU in 2023"
        url: "https://ec.europa.eu/eurostat/en/web/products-eurostat-news/w/ddn-20250423-1"
        tipo: institucion
        fecha: 2025-04-23
medidas:
  - titulo: "Policía focalizada en puntos calientes"
    descripcion: "Concentrar la presencia policial y la resolución de problemas en las calles o zonas pequeñas donde se concentra la mayoría de los delitos."
    donde: "Evaluada sobre todo en Estados Unidos y Reino Unido."
    evidencia: "Una revisión sistemática de la Campbell Collaboration (65 estudios) concluye que reduce la delincuencia y el desorden, y que el delito no se desplaza a las zonas cercanas; el efecto es mayor cuando se combina con resolución de problemas que cuando solo aumenta la patrulla."
    fuentes:
      - medio: "Campbell Systematic Reviews"
        titulo: "Braga, A. et al. Hot spots policing of small geographic areas effects on crime (2019)"
        url: "https://journals.sagepub.com/doi/reader/10.1002/cl2.1046"
        tipo: estudio
        fecha: 2019-09-01
  - titulo: "Juicio rápido para la ocupación ilegal"
    descripcion: "Tramitar como juicio rápido la usurpación de inmuebles y el allanamiento de morada para acortar los plazos de desalojo."
    donde: "España, desde abril de 2025."
    evidencia: "Todavía no hay una evaluación pública de sus efectos. La Fiscalía ha fijado criterios para su aplicación y la ley está recurrida ante el Tribunal Constitucional."
    fuentes:
      - medio: "BOE"
        titulo: "Circular 1/2025, de 26 de junio, de la Fiscalía General del Estado"
        url: "https://www.boe.es/boe/dias/2025/08/25/pdfs/BOE-A-2025-17153.pdf"
        tipo: institucion
        fecha: 2025-08-25
      - medio: "BOE"
        titulo: "Recurso de inconstitucionalidad contra la Ley Orgánica 1/2025"
        url: "https://boe.es/boe/dias/2025/10/13/pdfs/BOE-A-2025-20354.pdf"
        tipo: institucion
        fecha: 2025-10-13
  - titulo: "Penas más altas para la multirreincidencia"
    descripcion: "Endurecer la respuesta penal a quienes acumulan condenas por delitos leves, como los hurtos."
    donde: "España, desde abril de 2026."
    evidencia: "Lleva pocos meses en vigor y no hay datos sobre su efecto."
    fuentes:
      - medio: "BOE"
        titulo: "Ley Orgánica 1/2026, de 8 de abril, en materia de multirreincidencia"
        url: "https://www.boe.es/eli/es/lo/2026/04/08/1"
        tipo: institucion
        fecha: 2026-04-09
nota_revision: "Primera pasada. El portal del Ministerio del Interior no permite la consulta automática: las cifras del primer semestre de 2026 se toman de la información de Europa Press sobre el Balance de Criminalidad y deben contrastarse con el original."
