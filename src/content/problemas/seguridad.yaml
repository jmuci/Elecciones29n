nombre: Seguridad
orden: 3
tema: seguridad-justicia
resumen: "España tiene tasas de homicidio entre las más bajas de Europa, pero la criminalidad registrada sube levemente, empujada por la cibercriminalidad y los delitos sexuales. La multirreincidencia en hurtos y la ocupación ilegal de viviendas han motivado dos reformas legales en 2025 y 2026."
revisado: 2026-11-03
recorrido:
  - titulo: "Cambio en el tipo de delito: del delito en la calle al delito en internet"
    descripcion: "La cibercriminalidad (estafas en línea y otros delitos cometidos por medios informáticos) ya supone uno de cada cinco delitos registrados en España, mientras los delitos contra el patrimonio tradicionales bajan."
    fuentes:
      - medio: "Diario de León (Europa Press)"
        titulo: "La criminalidad aumenta un 0,5% por las agresiones sexuales"
        url: "https://www.diariodeleon.es/nacional/260918/2097733/criminalidad-aumenta-0-5-agresiones-sexuales.html"
        tipo: prensa
        fecha: 2026-09-18
  - titulo: "Juicios rápidos para la ocupación ilegal (2025)"
    descripcion: "La Ley Orgánica 1/2025, en vigor desde el 3 de abril de 2025, permite tramitar por juicio rápido los delitos de usurpación de inmuebles y el allanamiento de morada en su tipo básico. La ley está recurrida ante el Tribunal Constitucional."
    fuentes:
      - medio: "BOE"
        titulo: "Ley Orgánica 1/2025, de 2 de enero, de medidas en materia de eficiencia del Servicio Público de Justicia"
        url: "https://www.boe.es/buscar/act.php?id=BOE-A-2025-76"
        tipo: institucion
        fecha: 2025-01-03
      - medio: "BOE"
        titulo: "Circular 1/2025, de 26 de junio, de la Fiscalía General del Estado"
        url: "https://www.boe.es/boe/dias/2025/08/25/pdfs/BOE-A-2025-17153.pdf"
        tipo: institucion
        fecha: 2025-08-25
  - titulo: "Ley de multirreincidencia (2026)"
    descripcion: "La Ley Orgánica 1/2026, de 8 de abril, procedente de una proposición de ley de Junts, eleva las penas para quienes acumulan condenas por delitos leves contra el patrimonio, como los hurtos. Está en vigor desde el 10 de abril de 2026."
    fuentes:
      - medio: "BOE"
        titulo: "Ley Orgánica 1/2026, de 8 de abril, en materia de multirreincidencia"
        url: "https://www.boe.es/eli/es/lo/2026/04/08/1"
        tipo: institucion
        fecha: 2026-04-09
