propuestas:
  - subtema: sostenibilidad
    resumen: >-
      Propone garantizar la sostenibilidad del sistema de pensiones con más actividad económica,
      empleo y salarios, y con medidas de apoyo a las familias y a la natalidad frente al
      envejecimiento demográfico.
    fuente: vox-programa-es-sentido-comun
    pagina: "10-11"
  - resumen: >-
      Plantea que el Estado financie la cotización a la Seguridad Social de los españoles dedicados al
      cuidado de sus hijos, para que la crianza no penalice su jubilación.
    fuente: vox-programa-es-sentido-comun
    pagina: 51
