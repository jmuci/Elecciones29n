    fuente: vox-programa-economico-vivienda
    pagina: 45
  - subtema: alquiler
    resumen: Propone prohibir el alquiler de vivienda a inmigrantes en situación irregular.
    fuente: vox-recuperar-espana
    pagina: 3
  - subtema: [jóvenes, compra y propiedad]
    resumen: >-
      Plantea avales públicos para comprar vivienda y préstamos en condiciones favorables para
