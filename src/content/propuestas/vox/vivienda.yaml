      Propone liberar suelo, invertir en vivienda protegida y acabar con la ocupación ilegal de
      viviendas.
    fuente: vox-recuperar-espana
    pagina: 3
  - subtema: vivienda pública
    resumen: Propone que los españoles tengan acceso preferente a la vivienda pública.
