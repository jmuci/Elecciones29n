# Fase 1 (adelanto de Fase 2): no hay programa electoral publicado; se resume "Recuperar España" (2026).
# Auditoría 2026-11-02: cotejada con los PDF registrados (sha256 coincide); sin errores inequívocos, dudas en la PR de auditoría pp/vox.
partido: vox
tema: inmigracion
estado: parcial
revisado: 2026-11-02
propuestas:
  - subtema: regularización
    resumen: >-
      Propone prohibir las regularizaciones a gran escala y que quien entre en España de forma
      irregular no pueda regularizar nunca su situación.
    fuente: vox-recuperar-espana
    pagina: 5
  - subtema: expulsiones
    resumen: >-
      Propone repatriar a quienes estén en España en situación irregular, deportar por delitos graves
      o por delitos leves habituales y devolver a sus familias a los menores extranjeros no
      acompañados.
    fuente: vox-recuperar-espana
    pagina: 5
  - subtema: servicios y prestaciones
    resumen: >-
      Plantea retirar todas las ayudas y prestaciones sociales a los inmigrantes en situación
      irregular y que solo reciban atención sanitaria en caso de urgencia vital.
    fuente: vox-recuperar-espana
    pagina: 3
  - subtema: nacionalidad
    resumen: >-
      Propone revisar las concesiones de nacionalidad obtenidas de forma fraudulenta y endurecer los
      requisitos para obtenerla.
    fuente: vox-recuperar-espana
    pagina: 5
  - subtema: [fronteras, expulsiones]
    resumen: >-
      Plantea en Ceuta la expulsión inmediata de todos aquellos a quienes califica de "invasores",
      la suspensión de los acuerdos con Marruecos y la militarización de la frontera.
    fuente: vox-recuperar-espana
    pagina: 3
fuentes_revisadas:
  - vox-recuperar-espana
  - vox-programa-economico-vivienda
