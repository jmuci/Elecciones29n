# Revisado el 14-nov: frenteamplio.info sigue sin programa electoral. La nota del 13-nov presenta su
# "hoja de ruta contra la corrupción" con tres medidas prioritarias, que se recogen todas. La nota del
# 27-oct sobre el uso vejatorio de la IA en campaña es una carta a otros candidatos, no una propuesta
# de regeneración, y no se recoge.
partido: frente-amplio
tema: regeneracion
estado: parcial
revisado: 2026-11-14
propuestas:
  - subtema: corrupción
    resumen: >-
      Propone excluir durante 20 años de la contratación pública a las empresas condenadas por
      corrupción, sus representantes y administradores, las sociedades vinculadas y las UTE en que
      participen, reformando la Ley de Contratos del Sector Público y el Código Penal.
    fuente: frente-amplio-nota-contratacion-publica-empresas-corruptoras
    pagina: apartado «Las tres medidas prioritarias del Frente Amplio contra la corrupción», medida 1
  - subtema: corrupción
    resumen: >-
      Propone dotar de personal y recursos a la Autoridad Independiente de Protección del Informante
      para que proteja frente a represalias a las personas, entidades y periodistas que denuncien
      irregularidades.
    fuente: frente-amplio-nota-contratacion-publica-empresas-corruptoras
    pagina: apartado «Las tres medidas prioritarias del Frente Amplio contra la corrupción», medida 2
  - subtema: corrupción
    resumen: >-
      Propone crear una Agencia Independiente contra la Corrupción que pueda investigar e imponer
      sanciones administrativas, con un buzón anónimo de denuncias y capacidad para trasladar a la
      Fiscalía los casos con indicios de delito.
    fuente: frente-amplio-nota-contratacion-publica-empresas-corruptoras
    pagina: apartado «Las tres medidas prioritarias del Frente Amplio contra la corrupción», medida 3
fuentes_revisadas:
  - frente-amplio-nota-impuesto-acumulacion-vivienda
  - frente-amplio-nota-contratacion-publica-empresas-corruptoras
