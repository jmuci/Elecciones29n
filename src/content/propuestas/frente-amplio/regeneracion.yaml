# Programa electoral de Frente Amplio para el 29N, apartado 18.2 «Transparencia, lucha contra la
# corrupción y dimensión ética de la gestión pública» (pp. 168-169) y 18.7 «Modernización, renovación
# y democratización del acceso al sistema judicial» (pp. 175-176), revisados enteros el 2026-11-22.
# Selección de 5 propuestas (CONTRIBUTING §1.13-14). Pendiente de revisión humana contra la fuente.
# Fuera de la selección: ley de grupos de interés y agenda de reuniones con lobbies (pp. 168-169),
# estatuto para los expresidentes del Gobierno y auditoría de la deuda (p. 169), responsabilidad de
# los administradores de grandes empresas (p. 168), responsabilidad de jueces por dolo o culpa grave,
# juzgados de violencia sobre la mujer, justicia digital y justicia gratuita (pp. 175-176).
partido: frente-amplio
tema: regeneracion
estado: completo
revisado: 2026-11-22
propuestas:
  - subtema: corrupción
    resumen: >-
      Propone una Ley de Integridad Pública que obligue a inscribir y actualizar en el Registro
      Mercantil los cambios de propiedad de las sociedades limitadas y las anónimas no cotizadas,
      identificando a los socios, la cadena de propiedad y las personas que ejercen el control efectivo.
    fuente: frente-amplio-programa-29n
    pagina: 168
  - subtema: corrupción
    resumen: >-
      Plantea crear una Oficina Independiente contra la Corrupción con capacidad para investigar y
      sancionar, y poner en marcha de inmediato la Autoridad de Protección del Informante con el
      personal y los medios necesarios.
    fuente: frente-amplio-programa-29n
    pagina: 169
  - subtema: corrupción
    resumen: >-
      Propone que las empresas y personas condenadas por corrupción no puedan contratar con el sector
      público durante veinte años, eliminar la atenuante de dilaciones indebidas en los casos de
      corrupción y crear el decomiso administrativo o preventivo de bienes vinculados a actividades
      delictivas, sin necesidad de condena previa.
    fuente: frente-amplio-programa-29n
    pagina: 169
  - subtema: independencia de órganos
    resumen: >-
      Plantea reformar la Ley Orgánica del Poder Judicial para que los vocales del CGPJ del turno
      judicial se elijan por tres quintos y, si en dos meses no hay acuerdo, por mayoría absoluta en
      segunda votación, y para que el Consejo pueda constituirse con los vocales ya elegidos.
    fuente: frente-amplio-programa-29n
    pagina: 175
  - subtema: justicia
    resumen: >-
      Propone un plan plurianual de plazas para alcanzar en dos legislaturas la media europea de jueces
      y fiscales por habitante, y establecer la incompatibilidad total de jueces y magistrados con
      cualquier actividad remunerada ajena a la carrera judicial.
    fuente: frente-amplio-programa-29n
    pagina: "175-176"
fuentes_revisadas:
  - frente-amplio-programa-29n
  - frente-amplio-nota-contratacion-publica-empresas-corruptoras
