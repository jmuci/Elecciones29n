# Programa electoral de Frente Amplio para el 29N, apartado 4.3 «Pensiones públicas dignas» (pp. 63-64)
# revisado entero el 2026-11-22. Pendiente de revisión humana contra la fuente.
# Fuera de la selección: publicación del informe de auditoría independiente de la Seguridad Social
# (p. 64).
partido: frente-amplio
tema: pensiones
estado: completo
revisado: 2026-11-22
propuestas:
  - subtema: revalorización
    resumen: >-
      Propone reformar la Constitución para incluir entre los derechos de la Sección 2.ª del Capítulo
      II la pensión pública, su revalorización automática conforme al IPC, que ninguna pensión sea
      inferior al SMI y que no se privatice su gestión.
    fuente: frente-amplio-programa-29n
    pagina: "63-64"
  - subtema: edad de jubilación
    resumen: >-
      Plantea fijar la edad de jubilación en 65 años, permitir jubilarse a los 60 en oficios de
      especial penosidad (construcción, limpieza, ayuda a domicilio, camareras de piso y pesca) y
      eliminar los coeficientes reductores en las jubilaciones anticipadas involuntarias de quienes han
      cotizado más de 40 años.
    fuente: frente-amplio-programa-29n
    pagina: 64
  - subtema: sostenibilidad
    resumen: >-
      Propone seguir elevando de forma progresiva el tope máximo de cotización y reforzar el Mecanismo
      de Equidad Intergeneracional con una aportación adicional de las empresas más automatizadas.
    fuente: frente-amplio-programa-29n
    pagina: 64
  - subtema: revalorización
    resumen: >-
      Plantea subir las pensiones contributivas más bajas y las no contributivas por encima de la media
      para reducir la brecha de género, y reconocer los periodos dedicados a cuidados en la carrera de
      cotización.
    fuente: frente-amplio-programa-29n
    pagina: 64
fuentes_revisadas:
