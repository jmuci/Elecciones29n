# Fase 1 (adelanto de Fase 2): no hay programa electoral publicado; solo notas de prensa.
partido: frente-amplio
tema: impuestos
estado: parcial
revisado: 2026-11-05
propuestas:
  - subtema: vivienda
    resumen: >-
      Propone gravar con un 10 % de su valor las viviendas de empresas (desde la primera) y de
      personas físicas (desde la cuarta, si suman más de 800.000 €), salvo las alquiladas de forma
      asequible y estable.
    fuente: frente-amplio-nota-impuesto-acumulacion-vivienda
    pagina: entradilla
  - subtema: patrimonio y sucesiones
    resumen: >-
      Propone un impuesto anual sobre el patrimonio neto del 2 % a partir de un millón de euros y del
      3 % a partir de 50 millones, descontando lo ya pagado por Patrimonio y Grandes Fortunas.
    fuente: frente-amplio-nota-impuestos-grandes-fortunas-empresas
    pagina: "apartado «Tasar las grandes fortunas»"
  - subtema: sociedades
    resumen: >-
      Plantea elevar el tipo efectivo que pagan la gran empresa y la banca sobre sus beneficios,
      revisando las deducciones de los grandes grupos, como las de pérdidas de años anteriores.
    fuente: frente-amplio-nota-impuestos-grandes-fortunas-empresas
    pagina: "apartado «Impuesto a la banca»"
fuentes_revisadas:
  - frente-amplio-nota-impuesto-acumulacion-vivienda
  - frente-amplio-nota-impuestos-grandes-fortunas-empresas
