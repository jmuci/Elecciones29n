# Revisado el 14-nov: frenteamplio.info sigue sin programa electoral. La nota del 14-nov recoge tres
# medidas centrales (salud bucodental, visual y auditiva) y una cuarta sobre climaterio y menopausia;
# se recogen las cuatro. Ninguna encaja en los subtemas del tema, así que van sin subtema.
# La nota del 6-nov sobre la aplicación 'Tax the Rich' reparte una recaudación hipotética entre
# sanidad y otras partidas, pero no contiene propuestas sanitarias concretas.
partido: frente-amplio
tema: sanidad
estado: parcial
revisado: 2026-11-14
propuestas:
  - resumen: >-
      Propone extender la atención bucodental pública hasta cubrir, como mínimo, a la mitad de la
      población al final de la legislatura, empezando por los menores de 14 años, las personas
      vulnerables y las personas con discapacidad.
    fuente: frente-amplio-nota-gafas-audifonos-dentista
    pagina: apartado «Las tres medidas para ampliar la sanidad pública», medida 1
  - resumen: >-
      Propone ampliar a todas las edades el Plan VEO de ayudas para gafas y lentillas, hoy limitado a
      menores de 16 años, y avanzar hacia su acceso gratuito.
    fuente: frente-amplio-nota-gafas-audifonos-dentista
    pagina: apartado «Las tres medidas para ampliar la sanidad pública», medida 2
  - resumen: >-
      Plantea incluir los audífonos en la cartera común de servicios del Sistema Nacional de Salud,
      con financiación pública para todas las personas que los necesiten.
    fuente: frente-amplio-nota-gafas-audifonos-dentista
    pagina: apartado «Las tres medidas para ampliar la sanidad pública», medida 3
  - resumen: >-
      Propone reconocer la atención integral al climaterio y la menopausia como derecho en la sanidad
      pública, con más consultas, valoración individualizada y control del precio de los medicamentos.
    fuente: frente-amplio-nota-gafas-audifonos-dentista
    pagina: apartado «Las tres medidas para ampliar la sanidad pública», párrafo tras la medida 3
fuentes_revisadas:
  - frente-amplio-nota-impuesto-acumulacion-vivienda
  - frente-amplio-nota-gafas-audifonos-dentista
