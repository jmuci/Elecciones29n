# Fase 1 (adelanto de Fase 2): D21 no tiene programa; se resume su plan "Vivienda, prioridad nº1".
partido: democracia-21
tema: vivienda
estado: parcial
revisado: 2026-11-02
propuestas:
  - subtema: alquiler
    resumen: >-
      Propone limitar de forma temporal y excepcional los alquileres en zonas tensionadas, y que el
      Estado garantice el cobro al propietario si el inquilino es declarado vulnerable y no hay
      alternativa habitacional.
    fuente: democracia-21-vivienda-prioridad-1
    pagina: 4
  - subtema: alquiler
    resumen: >-
      Plantea un servicio gratuito y vinculante de mediación en arrendamientos (30 días) y juzgados
      especializados (60 días más), y tipificar como estafa firmar un contrato con intención
      premeditada de no pagar.
    fuente: democracia-21-vivienda-prioridad-1
    pagina: 4
  - subtema: vivienda pública
    resumen: >-
      Propone reasignar los fondos europeos no ejecutados a un Fondo Público Soberano para construir
      vivienda asequible y protegida.
    cita: "10.000 Millones de Fondos Europeos"
    fuente: democracia-21-vivienda-prioridad-1
    pagina: 3
  - subtema: oferta y construcción
    resumen: >-
      Propone un Plan Nacional de Barrios a 10 años con colaboración público-privada, sobre suelo
      público cedido mediante concesiones o derechos de superficie a 75 años.
    fuente: democracia-21-vivienda-prioridad-1
    pagina: 7
  - subtema: oferta y construcción
    resumen: >-
      Plantea un plazo máximo de 30 días para las licencias de obra mayor y que la comunidad autónoma
      asuma la competencia urbanística de los ayuntamientos que bloqueen proyectos de vivienda
      asequible.
    fuente: democracia-21-vivienda-prioridad-1
    pagina: 8
fuentes_revisadas:
  - democracia-21-vivienda-prioridad-1
  - democracia-21-espana-limpia
