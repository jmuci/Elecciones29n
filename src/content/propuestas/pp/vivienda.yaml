# Fase 1 (adelanto de Fase 2): no hay programa electoral publicado; se resumen el
# Contrato con España y el argumentario de vivienda.
# Auditoría 2026-11-02: cotejada con los PDF registrados (sha256 coincide); sin errores inequívocos, dudas en la PR de auditoría pp/vox.
partido: pp
tema: vivienda
estado: parcial
revisado: 2026-11-02
propuestas:
  - subtema: oferta y construcción
    resumen: >-
      Se compromete a aumentar la oferta de vivienda, facilitar suelo y reducir burocracia, con la
      colaboración de todas las administraciones.
    cita: "construir al menos un millón de nuevas viviendas"
    fuente: pp-contrato-con-espana
    pagina: 2
  - subtema: [oferta y construcción, okupación]
    resumen: >-
      Propone una nueva ley para poner en uso todo el suelo disponible, menos trámites y silencio
      administrativo positivo a los 90 días. Prevé aprobar las leyes de Suelo y Antiokupación en los
      100 primeros días de gobierno.
    fuente: pp-argumentario-nueva-generacion-propietarios
    pagina: 1
  - subtema: jóvenes
    resumen: >-
      Plantea dar prioridad a los jóvenes en el acceso al alquiler y a la compra, con ayudas
      económicas para adelantar su emancipación.
    fuente: pp-contrato-con-espana
    pagina: 2
  - subtema: [jóvenes, compra y propiedad]
    resumen: >-
      Propone una "Hucha Hogar Joven" y avales de hasta el 100 % para que los jóvenes compren
      vivienda.
    fuente: pp-argumentario-nueva-generacion-propietarios
    pagina: 1
  - subtema: okupación
    resumen: >-
      Se compromete a desalojar las viviendas ocupadas ilegalmente en 48 horas y a proteger el
      derecho de propiedad.
    fuente: pp-contrato-con-espana
    pagina: 2
fuentes_revisadas:
  - pp-contrato-con-espana
  - pp-argumentario-nueva-generacion-propietarios
  - pp-argumentario-menos-impuestos
