# Programa electoral del PP para el 29N (La Reconstrucción Nacional), revisado el 2026-11-11 en las
# secciones del tema y con búsqueda por palabras clave en el resto del documento. Selección de 5
# propuestas (CONTRIBUTING §1.13-14). Pendiente de revisión humana contra la fuente.
partido: pp
tema: vivienda
estado: parcial
revisado: 2026-11-11
propuestas:
  - subtema: oferta y construcción
    resumen: >-
      Se compromete a construir un millón de viviendas movilizando suelo público y privado junto con
      comunidades autónomas y entidades locales. Prevé una nueva Ley del Suelo y licencias de obra
      nueva y rehabilitación resueltas en tres meses, con silencio positivo.
    fuente: pp-programa-reconstruccion-nacional
    pagina: 53
  - subtema: alquiler
    resumen: >-
      Propone derogar la Ley de Vivienda y eliminar las zonas tensionadas y el índice de precios del
      alquiler.
    fuente: pp-programa-reconstruccion-nacional
    pagina: 53
  - subtema: [jóvenes, compra y propiedad]
    resumen: >-
      Plantea ampliar a los menores de 40 años el aval público, que cubre hasta el 20 % del valor de
      la vivienda, y crear la «Hucha Hogar Joven»: cuenta de ahorro con aportaciones de hasta 2.000 €
      al año, deducción fiscal del 20 % y rendimientos exentos si se destina a la primera vivienda.
    fuente: pp-programa-reconstruccion-nacional
    pagina: 55
  - subtema: alquiler
    resumen: >-
      Propone una deducción en el IRPF para los inquilinos de vivienda habitual, graduada según sus
      ingresos, y una deducción o crédito fiscal para el propietario particular que renueve el
      contrato tres años subiendo la renta por debajo del IPC.
    fuente: pp-programa-reconstruccion-nacional
    pagina: 55
  - subtema: okupación
    resumen: >-
      Plantea una ley para que el propietario recupere en 48 horas, por orden judicial, la vivienda
      ocupada ilegalmente, y endurecer las penas a las mafias que promuevan la ocupación.
    fuente: pp-programa-reconstruccion-nacional
    pagina: 55
