# Programa electoral del PP para el 29N (La Reconstrucción Nacional), revisado el 2026-11-11 en las
# secciones del tema y con búsqueda por palabras clave en el resto del documento. Selección de 5
# propuestas (CONTRIBUTING §1.13-14). Pendiente de revisión humana contra la fuente.
partido: pp
tema: inmigracion
estado: parcial
revisado: 2026-11-11
propuestas:
  - subtema: fronteras
    resumen: >-
      Propone reforzar con agentes, vigilancia e infraestructuras las fronteras terrestres, marítimas
      y aeroportuarias, con apoyo de las Fuerzas Armadas cuando lo exija la seguridad nacional. Prevé
      reformar la Ley de Extranjería para que el rechazo en frontera cubra también las entradas a nado
      en Ceuta y Melilla.
    fuente: pp-programa-reconstruccion-nacional
    pagina: 21
  - resumen: >-
      Plantea visados por puntos y cupos anuales de trabajadores por sectores, revisados cada año
      según el paro, los puestos sin cubrir y la capacidad en vivienda, servicios públicos y empleo.
      Solo participarían los países que colaboren en los retornos.
    fuente: pp-programa-reconstruccion-nacional
    pagina: 22
  - subtema: regularización
    resumen: >-
      Prevé prohibir por ley las regularizaciones masivas e indiscriminadas y que el arraigo sea un
      reconocimiento individual excepcional.
    fuente: pp-programa-reconstruccion-nacional
    pagina: "22-23"
  - subtema: expulsiones
    resumen: >-
      Plantea que la expulsión sea la regla para los extranjeros condenados por delitos sexuales,
      delitos de sangre y multirreincidencia, y que tener causas pendientes en varios juzgados no la
      frene.
    fuente: pp-programa-reconstruccion-nacional
    pagina: 23
  - subtema: nacionalidad
    resumen: >-
      Propone una nueva Ley de Nacionalidad que exija residencia legal y continuada, conocimiento
      suficiente del español, de la historia y de las instituciones, ausencia de antecedentes penales
      y cumplimiento de las obligaciones tributarias y con la Seguridad Social, y mantener un trato
      preferente para países con vínculos históricos, culturales y lingüísticos con España.
    fuente: pp-programa-reconstruccion-nacional
    pagina: 50
fuentes_revisadas:
