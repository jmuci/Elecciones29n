# Programa electoral del PP para el 29N (La Reconstrucción Nacional), revisado el 2026-11-11 en las
# secciones del tema y con búsqueda por palabras clave en el resto del documento. Selección de 5
# propuestas como máximo (CONTRIBUTING §1.13-14). Pendiente de revisión humana contra la fuente.
partido: pp
tema: sanidad
estado: parcial
revisado: 2026-11-11
propuestas:
  - subtema: listas de espera
    resumen: >-
      Propone un Pacto de Estado por la Sanidad Pública con las comunidades autónomas y un plan
      urgente de reducción de las listas de espera. Prevé que el nuevo sistema de financiación
      autonómica tenga la sanidad como uno de sus pilares.
    fuente: pp-programa-reconstruccion-nacional
    pagina: "68-69"
  - subtema: atención primaria
    resumen: >-
      Se compromete a incorporar más profesionales al Sistema Nacional de Salud, con al menos 4.500
      médicos más en Atención Primaria, y a mejorar sus condiciones de trabajo, conciliación y
      retribución.
    fuente: pp-programa-reconstruccion-nacional
    pagina: 69
  - subtema: salud mental
    resumen: >-
      Prevé aprobar un Plan Nacional de Salud Mental 2027-2037 con financiación garantizada, más
      profesionales y acceso a la atención psicológica y psiquiátrica desde Atención Primaria.
    fuente: pp-programa-reconstruccion-nacional
    pagina: 70
  - resumen: >-
      Plantea acordar con las comunidades autónomas una estrategia de servicios preventivos comunes,
      con más vacunación, cribados y diagnóstico precoz, y reforzar la Agencia Estatal de Salud
      Pública.
    fuente: pp-programa-reconstruccion-nacional
    pagina: "69-70"
  - resumen: >-
      Propone aprobar una ley nacional de cuidados paliativos que garantice el acceso a estos
      cuidados, el tratamiento del dolor y la atención domiciliaria.
    fuente: pp-programa-reconstruccion-nacional
    pagina: "70-71"
fuentes_revisadas:
  - pp-programa-reconstruccion-nacional
  - pp-contrato-con-espana
  - pp-nota-funez-proyecto-sanitario
