# Programa electoral del PP para el 29N (La Reconstrucción Nacional), revisado el 2026-11-11 en las
# secciones del tema y con búsqueda por palabras clave en el resto del documento. Selección de 5
# propuestas como máximo (CONTRIBUTING §1.13-14). Pendiente de revisión humana contra la fuente.
partido: pp
tema: exterior-defensa
estado: parcial
revisado: 2026-11-11
propuestas:
  - subtema: UE
    resumen: >-
      Plantea que España esté en la mesa donde se decide Europa y que la Unión reúna fuerza política,
      económica y militar, con mercado único, interconexiones energéticas y compras conjuntas de
      defensa. Prevé defender en el presupuesto europeo 2028-2034 que la PAC y la cohesión sigan
      siendo políticas propias, sin recortes para España.
    fuente: pp-programa-reconstruccion-nacional
    pagina: "73-74"
  - subtema: OTAN
    resumen: >-
      Prevé reforzar, cuando sea necesario, los contingentes españoles de la OTAN, contribuir a
      proteger las rutas marítimas y reforzar el pilar europeo en la Alianza.
    fuente: pp-programa-reconstruccion-nacional
    pagina: 26
  - subtema: [gasto en defensa, Fuerzas Armadas]
    resumen: >-
      Propone una ley de programación y financiación de la defensa, con inversión plurianual y
      objetivos de personal y material a medio y largo plazo. Prevé aumentar los efectivos de las
      Fuerzas Armadas, reconocerlos como profesión de riesgo y mejorar sus retribuciones.
    fuente: pp-programa-reconstruccion-nacional
    pagina: 26
  - subtema: política exterior
    resumen: >-
      Se compromete a mantener el apoyo político, económico, militar y humanitario a Ucrania y las
      sanciones contra Rusia mientras dure la agresión.
    fuente: pp-programa-reconstruccion-nacional
    pagina: 74
  - subtema: [política exterior, soberanía e integridad territorial]
    resumen: >-
      Plantea defender la integridad territorial de Ceuta, Melilla, Canarias y los demás territorios
      españoles en el norte de África, volver a una política de equilibrio con Marruecos y Argelia y
      exigir a Bruselas para Ceuta y Melilla el trato que dio en 2025 a sus regiones fronterizas con
      Rusia.
    fuente: pp-programa-reconstruccion-nacional
    pagina: 74
fuentes_revisadas:
