# Programa electoral de Podemos para el 29N, capítulo «España, república plurinacional»: medidas de
# policía y libertades 423-429 (pp. 132-134), revisadas el 2026-11-22. Sustituye al documento político
# de la V Asamblea (anterior a la convocatoria, CONTRIBUTING §1.4). Pendiente de revisión humana
# contra la fuente.
# Una búsqueda por palabras clave en todo el programa no encuentra propuestas sobre multirreincidencia
# ni sobre ocupación ilegal de vivienda en el ámbito penal; las medidas sobre desalojos están en
# vivienda.
# Fuera de la selección: derogación de la Ley de Secretos Oficiales vigente y nueva ley (426, p.
# 133), caso Pegasus (425, pp. 132-133), identificación y registro de los agentes y revisión de los
# protocolos de uso de la fuerza (424, p. 132), medidas sobre trata y violencia sexual (157-159,
# pp. 54-55).
partido: podemos
tema: seguridad-justicia
estado: completo
revisado: 2026-11-22
propuestas:
  - subtema: policía
    resumen: >-
      Propone que todos los agentes policiales lleven un número de identificación visible desde
      cualquier ángulo, implantar progresivamente cámaras corporales y sistemas de grabación en los
      vehículos policiales, y prohibir la infiltración de agentes en movimientos sociales pacíficos.
    fuente: podemos-programa-paz-casa-trabajo
    pagina: 132
  - resumen: >-
      Plantea derogar la reforma de la Ley Orgánica de protección de la seguridad ciudadana y aprobar
      una regulación que proteja la libertad de expresión,
      reunión y manifestación, con la prohibición de las pelotas de goma como método de contención, un
      plazo máximo de detención de 48 horas en cualquier supuesto y un modelo reforzado de Habeas
      Corpus.
    fuente: podemos-programa-paz-casa-trabajo
    pagina: 133
  - subtema: Código Penal
    resumen: >-
      Propone revisar las disposiciones del Código Penal que puedan restringir desproporcionadamente la
      protesta pacífica, la crítica política y la libertad de información, y eliminar de la legislación
      la presunción de veracidad de los atestados y de las declaraciones de los agentes.
    fuente: podemos-programa-paz-casa-trabajo
    pagina: 133
  - subtema: Código Penal
    resumen: >-
      Plantea despenalizar el cultivo y la tenencia de cannabis en los ámbitos personal y colectivo y
      regular los clubs sociales de cannabis, con un control del Estado de la producción, la
      distribución y el consumo.
    fuente: podemos-programa-paz-casa-trabajo
    pagina: "133-134"
fuentes_revisadas:
  - podemos-programa-paz-casa-trabajo
  - podemos-documento-politico-v-asamblea
