# Programa electoral de Podemos para el 29N: medidas de energía de «Los precios tienen que bajar»
# (36-39, pp. 18-19) y de «Planeta solo hay uno» (313-361, pp. 94-110), revisadas el 2026-11-22.
# Sustituye al documento político de la V Asamblea (anterior a la convocatoria, CONTRIBUTING §1.4).
# Selección de 5 propuestas (CONTRIBUTING §1.13-14), una por subtema más el control público de la
# energía, que el programa destaca en el capítulo de precios. Pendiente de revisión humana contra la
# fuente.
# Fuera de la selección: ciudades verdes, calidad del aire y olas de calor (314, 318-324, pp. 95-97),
# residuo cero y economía circular (326, 385-386), Doñana y el Mar Menor (327, p. 97), instalación
# fotovoltaica pública, autoconsumo y comunidades energéticas (330-335, pp. 98-101), hidrógeno (337),
# consumo energético de las grandes tecnológicas (338), movilidad y ferrocarril (340-356, pp.
# 103-108), agricultura, ganadería y pesca (362-381, pp. 110-116), minas, incendios, bomberos y
# bienestar animal (383-405, pp. 117-126). La gratuidad del transporte público (40, p. 19) y la
# fiscalidad ambiental (41, pp. 19-20) no tienen subtema.
partido: podemos
tema: energia-clima
estado: completo
revisado: 2026-11-22
propuestas:
  - subtema: renovables
    resumen: >-
      Propone reformar la Ley de Cambio Climático para reducir las emisiones al menos un 55 % en 2030
      respecto a 1990, con la ambición del 65 %, y adelantar a 2040 la neutralidad climática. Fija un
      objetivo de al menos un 95 % de generación eléctrica renovable en 2035 y mantiene
      transitoriamente los ciclos combinados de gas como respaldo.
    fuente: podemos-programa-paz-casa-trabajo
    pagina: "94-95, 98"
  - subtema: precio de la luz
    resumen: >-
      Plantea que las tarifas domésticas de electricidad y gas no superen en más de un 5 % la media de
      lo facturado en el periodo de referencia anterior, un tope al gas de 40 €/MWh, un mercado
      eléctrico que pague el MWh según su coste de producción y una factura de la luz progresiva por
      tramos de consumo.
    fuente: podemos-programa-paz-casa-trabajo
    pagina: "18-19"
  - resumen: >-
      Propone crear una Empresa Pública de Energía que gestione los saltos hidroeléctricos a medida que
      reviertan al Estado, y que esta adquiera la mayoría absoluta del accionariado de Repsol. Plantea
      también alcanzar el 100 % de capital público en Red Eléctrica.
    fuente: podemos-programa-paz-casa-trabajo
    pagina: "18, 98"
  - subtema: nuclear
    resumen: >-
      Plantea cumplir el calendario de cierre de las centrales nucleares, empezando por Almaraz, con
      planes de transición justa para las comarcas afectadas, exigir una consulta popular en el lugar
      elegido para cualquier almacén de residuos nucleares e impulsar en la UE una hoja de ruta para
      abandonar la fisión nuclear.
    fuente: podemos-programa-paz-casa-trabajo
    pagina: 103
  - subtema: agua
    resumen: >-
      Propone un plan estatal de investigación y reconversión hidrológica con objetivos vinculantes, una
      moratoria a los regadíos hiperintensivos en manos de fondos de inversión y grandes
      multinacionales, un Plan Nacional de Recuperación de Acuíferos y Humedales y un plan de choque
      contra las extracciones ilegales de agua.
    fuente: podemos-programa-paz-casa-trabajo
    pagina: "108-110"
fuentes_revisadas:
  - podemos-programa-paz-casa-trabajo
  - podemos-documento-politico-v-asamblea
