# Programa electoral de Podemos para el 29N, capítulo «Vida solo hay una»: medidas de igualdad y
# derechos 145-175 (pp. 51-59) y derecho a una muerte digna (313, p. 94), revisadas el 2026-11-22.
# Sustituye al documento político de la V Asamblea (anterior a la convocatoria, CONTRIBUTING §1.4).
# Selección de 5 propuestas (CONTRIBUTING §1.13-14): las primeras medidas del capítulo, que el
# programa ordena por prioridad, y una por subtema. Pendiente de revisión humana contra la fuente.
# Fuera de la selección: violencias digitales, violencia sexual, trata y explotación (147-149, 157-159,
# pp. 51-55), plan de reparación y servicios de atención a víctimas de violencia machista (151-156,
# pp. 53-56), anticoncepción y reproducción asistida (166-168, pp. 56-57), paridad y participación
# política (172-173), discapacidad y accesibilidad (174-177, pp. 58-59), resto de medidas LGTBIQA+
# de la medida 150 (p. 52).
partido: podemos
tema: igualdad-derechos
estado: completo
revisado: 2026-11-22
propuestas:
  - subtema: igualdad
    resumen: >-
      Propone un fondo de contingencia de mil millones de euros para las políticas contra todas las
      formas de violencia machista, que garantice su financiación estable y a largo plazo mediante la
      reforma de la Ley General Presupuestaria.
    fuente: podemos-programa-paz-casa-trabajo
    pagina: 51
  - subtema: aborto
    resumen: >-
      Plantea eliminar del Código Penal todas las referencias al aborto consentido e incorporar
      expresamente el derecho al aborto en la Constitución, en el artículo 15, como derecho fundamental.
    fuente: podemos-programa-paz-casa-trabajo
    pagina: 51
  - subtema: LGTBI
    resumen: >-
      Propone incluir la opción de género no binario en los formularios y documentos oficiales de
      identidad, un cupo laboral trans en el empleo público, el reconocimiento legal de la violencia
      intragénero y la eliminación de obstáculos para la libre determinación de género en las
      infancias trans menores de 14 años.
    fuente: podemos-programa-paz-casa-trabajo
    pagina: "51-52"
  - subtema: igualdad
    resumen: >-
      Plantea incorporar a la Constitución un mandato transversal de erradicación de toda forma de
      violencia contra las mujeres, un mandato de perspectiva de género en los derechos sociales y el
      derecho al cuidado como principio rector de la política económica y social.
    fuente: podemos-programa-paz-casa-trabajo
    pagina: 57
  - subtema: eutanasia
    resumen: >-
      Propone reforzar los recursos de las Comisiones de Garantía y Evaluación y de los equipos
      sanitarios para agilizar los procedimientos de la muerte digna, con una vía de tramitación
      prioritaria para las situaciones urgentes y equipos suficientes para que la objeción de
      conciencia individual no sea un obstáculo.
    fuente: podemos-programa-paz-casa-trabajo
    pagina: 94
fuentes_revisadas:
  - podemos-programa-paz-casa-trabajo
  - podemos-documento-politico-v-asamblea
