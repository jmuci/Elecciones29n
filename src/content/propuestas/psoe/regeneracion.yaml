# Programa electoral del PSOE para el 29N («La fuerza de seguir avanzando», 500 compromisos
# numerados), revisado entero el 2026-11-15. Selección de 5 propuestas como máximo (CONTRIBUTING
# §1.13-14): primero los compromisos que el programa destaca con el número en un recuadro rojo (en este
# tema, 371) y después los más concretos. Pendiente de revisión humana contra la fuente.
# Fuera de la selección (n.º de compromiso): acceso a las carreras judicial y fiscal con pruebas
# anonimizadas y prohibición de la financiación privada de las asociaciones judiciales y fiscales
# (435), ampliación de las plantillas judiciales y fiscales (434), programa Cumpliendo (447), control
# de la contratación, las subvenciones y la financiación política (448), Defensor de las Generaciones
# Futuras (375, 444), simplificación del voto exterior y estudio de una circunscripción exterior
# (489, 492).
# La Resolución del 41.º Congreso (2024) deja de citarse (§1.4) y queda en fuentes_revisadas.
partido: psoe
tema: regeneracion
estado: completo
revisado: 2026-11-15
propuestas:
  - resumen: >-
      Propone crear un escaño ciudadano sin voto en el Congreso y el Senado para que la sociedad civil
      pueda preguntar al Gobierno y presentar iniciativas y enmiendas, y reducir las firmas necesarias
      para la iniciativa legislativa popular.
    fuente: psoe-programa-la-fuerza-de-seguir-avanzando
    pagina: 91
  - resumen: >-
      Plantea suprimir los aforamientos de los cargos públicos para los delitos ajenos al ejercicio de
      su cargo y rebajar la edad de voto a los 16 años.
    fuente: psoe-programa-la-fuerza-de-seguir-avanzando
    pagina: 91
  - subtema: corrupción
    resumen: >-
      Propone una Ley Orgánica de Integridad Pública, una Estrategia Nacional Anticorrupción con mapas
      de riesgos en todas las administraciones y una Agencia Independiente de Integridad Pública que
      coordine los organismos de supervisión y proteja a quienes denuncian.
    fuente: psoe-programa-la-fuerza-de-seguir-avanzando
    pagina: 103
  - subtema: corrupción
    resumen: >-
      Plantea una ley de grupos de interés con registro obligatorio, publicidad de sus reuniones y
      huella normativa, y más transparencia sobre el patrimonio, las actividades y las
      incompatibilidades de los cargos públicos.
    fuente: psoe-programa-la-fuerza-de-seguir-avanzando
    pagina: 103
  - subtema: [justicia, independencia de órganos]
    resumen: >-
      Propone un mandato de cinco años para la Fiscalía General del Estado, desvinculado de la
      legislatura, prohibir las instrucciones del Gobierno sobre casos concretos y una nueva Ley de
      Enjuiciamiento Criminal que atribuya la investigación a la Fiscalía bajo supervisión judicial.
    fuente: psoe-programa-la-fuerza-de-seguir-avanzando
    pagina: 101
