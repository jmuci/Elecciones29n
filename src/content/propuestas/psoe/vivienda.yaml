    resumen: >-
      Se compromete a que el próximo Parlamento mantenga y refuerce el decreto de vivienda, que
      según el partido protege a los pequeños propietarios y a los inquilinos frente a la
      especulación.
    fuente: psoe-nota-esperanza-dos-hermanas
    pagina: "párrafo 2"
  - subtema: vivienda pública
    resumen: Fija como objetivo para 2030 que España tenga un 6 % de vivienda protegida.
    fuente: psoe-nota-supremo-ponferrada
    pagina: "párrafo 6"
