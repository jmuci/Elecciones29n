# Fase 4 (2-nov): psoe.es no tiene programa para el 29N; se resumen compromisos de las noticias de
# campaña de su web (Actualidad > Noticias). `pagina` cuenta los párrafos del cuerpo de la noticia.
# Como hay notas para el 29N sobre vivienda, no se cita la Resolución del 41.º Congreso
# (CONTRIBUTING §1.4). Las noticias sobre los decretos del Consejo de Ministros (línea TU CASA,
# reales decretos-ley de vivienda) son acción de gobierno y no se recogen.
partido: psoe
tema: vivienda
estado: parcial
