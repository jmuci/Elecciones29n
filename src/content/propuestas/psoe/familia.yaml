propuestas:
  - subtema: permisos
    resumen: Se compromete a extender el permiso de nacimiento y cuidado del menor hasta las 20 semanas.
    fuente: psoe-resolucion-politica-41-congreso
    pagina: 85
  - subtema: permisos
    resumen: >-
      Propone dar a las familias monoparentales una protección especial equivalente a la de las
      familias numerosas y estudiar que puedan extender los permisos de nacimiento.
    fuente: psoe-resolucion-politica-41-congreso
    pagina: 85
  - subtema: conciliación
    resumen: >-
      Propone una Ley de Usos del Tiempo que haga obligatorias la flexibilidad horaria, la
      concentración de la jornada o el teletrabajo con derecho a la desconexión.
    fuente: psoe-resolucion-politica-41-congreso
    pagina: 122
