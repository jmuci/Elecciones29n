# Programa electoral del PSOE para el 29N («La fuerza de seguir avanzando», 500 compromisos
# numerados), revisado entero el 2026-11-15. Selección de 5 propuestas como máximo (CONTRIBUTING
# §1.13-14): primero los compromisos que el programa destaca con el número en un recuadro rojo (en este
# tema, 229) y después los más concretos. Pendiente de revisión humana contra la fuente.
# Fuera de la selección (n.º de compromiso): Fondo de Compensación Interterritorial e incentivos
# regionales (230), financiación local (232), España rural y despoblación (233), actualización de la
# Ley de Bases del Régimen Local (386), Canarias, Ceuta y Melilla (387) y reconocimiento del catalán,
# el euskera y el gallego como lenguas oficiales de la UE (485). El programa no incluye propuestas
# específicas sobre Cataluña.
# La Resolución del 41.º Congreso (2024) deja de citarse (§1.4) y queda en fuentes_revisadas.
partido: psoe
tema: territorial
estado: completo
revisado: 2026-11-15
propuestas:
  - subtema: financiación autonómica
    resumen: >-
      Prevé impulsar el nuevo sistema de financiación autonómica propuesto por el Gobierno y aprobado en
      el Consejo de Política Fiscal y Financiera, que aporta 21.000 millones de euros adicionales a las
      comunidades autónomas.
    fuente: psoe-programa-la-fuerza-de-seguir-avanzando
    pagina: 61
  - subtema: financiación autonómica
    resumen: >-
      Plantea avanzar en la asunción parcial por el Estado de 83.000 millones de euros de deuda
      autonómica, para reducir la carga financiera de las comunidades y liberar recursos para los
      servicios públicos.
    fuente: psoe-programa-la-fuerza-de-seguir-avanzando
    pagina: 62
  - resumen: >-
      Propone reformar el Senado para convertirlo en una cámara de representación territorial, con
      circunscripciones que coincidan con el ámbito autonómico.
    fuente: psoe-programa-la-fuerza-de-seguir-avanzando
    pagina: 92
  - resumen: >-
      Plantea convocar la Conferencia de Presidentes con una periodicidad fija y un reglamento que
      garantice el seguimiento de sus acuerdos, y una ley de cooperación entre el Estado, las
      comunidades autónomas y los gobiernos locales que reduzca la conflictividad competencial.
    fuente: psoe-programa-la-fuerza-de-seguir-avanzando
    pagina: 92
  - subtema: lenguas
    resumen: >-
      Propone consolidar el uso de las lenguas cooficiales en las Cortes Generales y extenderlo a la
      atención de la Administración General del Estado en los territorios donde son oficiales.
    fuente: psoe-programa-la-fuerza-de-seguir-avanzando
    pagina: 92
