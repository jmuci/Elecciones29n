# Programa electoral del PSOE para el 29N («La fuerza de seguir avanzando», 500 compromisos
# numerados), revisado entero el 2026-11-15. Selección de 5 propuestas como máximo (CONTRIBUTING
# §1.13-14): en este tema el programa no destaca ningún compromiso con el número en un recuadro rojo;
# se eligen los más concretos. Pendiente de revisión humana contra la fuente.
# Fuera de la selección (n.º de compromiso): participación social, cívica y política de las personas
# inmigrantes (390), Unidad de Apoyo a la Infancia Migrante (200) y lucha contra el racismo y la
# discriminación, con la Ley Zerolo (392-398). El programa no trata la regularización, las
# expulsiones ni la nacionalidad.
# La Resolución del 41.º Congreso (2024) deja de citarse (§1.4) y queda en fuentes_revisadas.
partido: psoe
tema: inmigracion
estado: completo
revisado: 2026-11-15
propuestas:
  - subtema: integración
    resumen: >-
      Propone desplegar el Plan de Integración y Ciudadanía 2026-2030, con una dotación inicial de 500
      millones de euros, para favorecer la integración, la igualdad de derechos y el cumplimiento de
      las obligaciones de las personas migrantes.
    fuente: psoe-programa-la-fuerza-de-seguir-avanzando
    pagina: 93
  - subtema: integración
    resumen: >-
      Plantea simplificar los trámites, impulsar la contratación en origen, agilizar la homologación de
      títulos y facilitar el acceso al empleo de quienes vienen a vivir y trabajar en España.
    fuente: psoe-programa-la-fuerza-de-seguir-avanzando
    pagina: 93
  - subtema: asilo
    resumen: >-
      Propone ampliar las vías legales y seguras de protección internacional, con reasentamiento y
      visados humanitarios, y reforzar el sistema público de acogida y asilo con financiación estable y
      atención en salud mental, educación, traducción e integración.
    fuente: psoe-programa-la-fuerza-de-seguir-avanzando
    pagina: 93
  - subtema: asilo
    resumen: >-
      Se compromete a un sistema de acogida que refuerce la protección de los niños, niñas y
      adolescentes que llegan solos, con el interés superior del menor en el centro.
    fuente: psoe-programa-la-fuerza-de-seguir-avanzando
    pagina: 94
  - subtema: [fronteras, asilo]
    resumen: >-
      Plantea defender en la UE una política migratoria basada en la solidaridad, las necesidades del
      mercado de trabajo y los derechos humanos, que combine la lucha contra las mafias con la gestión
      del asilo, las fronteras y las vías legales y seguras.
    fuente: psoe-programa-la-fuerza-de-seguir-avanzando
    pagina: 111
