# Programa electoral del PSOE para el 29N («La fuerza de seguir avanzando», 500 compromisos
# numerados), revisado entero el 2026-11-15. Selección de 5 propuestas como máximo (CONTRIBUTING
# §1.13-14): primero los compromisos que el programa destaca con el número en un recuadro rojo (en este
# tema, 136, 137, 153, 154 y 155; los tres últimos se agrupan en una propuesta) y después los más
# concretos. Pendiente de revisión humana contra la fuente.
# Fuera de la selección (n.º de compromiso): atención pediátrica y de proximidad en zonas rurales
# (139), cuidados paliativos (140), contrato social con los profesionales sanitarios (142), Plan VEO
# (144), medicamentos innovadores (145), eutanasia (147, en igualdad-derechos), Ley de Salud Digital
# (148), estrategia contra el cáncer (150) y salud sexual y reproductiva (156).
# La Resolución del 41.º Congreso (2024) deja de citarse (§1.4) y queda en fuentes_revisadas.
partido: psoe
tema: sanidad
estado: completo
revisado: 2026-11-15
propuestas:
  - subtema: listas de espera
    resumen: >-
      Se compromete a acabar con las listas de espera, con una financiación pública de la sanidad en
      torno al 7 % del PIB, el refuerzo del carácter público del SNS y más inversión en prevención
      hasta converger con la media europea.
    fuente: psoe-programa-la-fuerza-de-seguir-avanzando
    pagina: 50
  - resumen: >-
      Propone incorporar progresivamente a la sanidad pública los tratamientos dentales básicos de los
      adultos (empastes, endodoncias, reconstrucciones y tratamientos periodontales) y, mientras tanto,
      una ayuda directa de hasta 200 euros anuales por persona, empezando por las rentas medias y bajas.
    fuente: psoe-programa-la-fuerza-de-seguir-avanzando
    pagina: 50
  - resumen: >-
      Plantea limitar la privatización de la sanidad, con la gestión directa como modalidad preferente,
      y aprobar una Ley de Buen Gobierno y Buena Gestión del SNS.
    fuente: psoe-programa-la-fuerza-de-seguir-avanzando
    pagina: "50-51"
  - subtema: [salud mental, atención primaria]
    resumen: >-
      Propone garantizar la atención psicológica gratuita en la sanidad pública, con una primera
      consulta en un plazo máximo de 30 días, y reforzar la atención primaria con equipos
      multidisciplinares y más capacidad diagnóstica.
    fuente: psoe-programa-la-fuerza-de-seguir-avanzando
    pagina: 51
  - resumen: >-
      Prevé ayudas para compensar el sobrecoste de los productos sin gluten, regular los vapeadores y
      las bolsas de nicotina (información de componentes, dosis máximas y prohibición de sabores
      agradables) y mejorar el diagnóstico temprano de las enfermedades raras.
    fuente: psoe-programa-la-fuerza-de-seguir-avanzando
    pagina: 52
