tema: territorial
orden: 1
pregunta: ¿Qué modelo territorial prefieres?
opciones:
  - texto: Defender la soberanía nacional y la integridad territorial.
    partidos:
      - { partido: pp, fuente: pp-contrato-con-espana, pagina: 2 }
  - texto: >-
      Que el Estado recupere competencias como la sanidad y la educación, con el objetivo último de eliminar el
      Estado autonómico.
    partidos:
      - { partido: vox, fuente: vox-programa-economico-vivienda, pagina: 39 }
  - texto: >-
      Reconocer el derecho a decidir de los pueblos de España y avanzar hacia un modelo confederal de
      soberanías compartidas.
    partidos:
      - { partido: podemos, fuente: podemos-documento-politico-v-asamblea, pagina: 41 }
revisado: 2026-11-02
