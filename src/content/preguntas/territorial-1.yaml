tema: territorial
orden: 1
pregunta: ¿Qué modelo territorial prefieres?
opciones:
  - texto: >-
      Defender la unidad de España y el orden constitucional, recuperando los delitos de sedición y de
      convocatoria de referéndum ilegal.
    partidos:
      - { partido: pp, fuente: pp-programa-reconstruccion-nacional, pagina: 16 }
  - texto: >-
      Recuperar el delito de sedición, prohibir los indultos por delitos contra la integridad territorial e
      ilegalizar los partidos que atenten contra la unidad de España.
    partidos:
      - { partido: vox, fuente: vox-programa-es-sentido-comun, pagina: "55-56" }
  - texto: >-
      Avanzar hacia una república plurinacional, con un proceso constituyente y un referéndum sobre la forma de
      Estado.
    partidos:
      - { partido: podemos, fuente: podemos-programa-paz-casa-trabajo, pagina: 128 }
