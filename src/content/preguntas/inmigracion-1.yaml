tema: inmigracion
orden: 1
pregunta: ¿Qué hacer con las personas que viven en España en situación irregular?
opciones:
  - texto: Regularizar de inmediato a quienes viven y trabajan en España.
    partidos:
      - { partido: podemos, fuente: podemos-documento-politico-v-asamblea, pagina: 34 }
  - texto: >-
      Que entrar o permanecer de forma irregular no permita obtener la residencia, y prohibir por ley las
      regularizaciones colectivas.
    partidos:
      - { partido: pp, fuente: pp-contrato-con-espana, pagina: 2 }
  - texto: Repatriarlas y que quien haya entrado de forma irregular no pueda regularizar nunca su situación.
    partidos:
      - { partido: vox, fuente: vox-recuperar-espana, pagina: 5 }
revisado: 2026-11-02
