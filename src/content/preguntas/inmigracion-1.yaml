tema: inmigracion
orden: 1
pregunta: ¿Qué hacer con las personas que viven en España en situación irregular?
opciones:
  - texto: Establecer un procedimiento permanente de regularización basado en el arraigo.
    partidos:
      - { partido: podemos, fuente: podemos-programa-paz-casa-trabajo, pagina: 67 }
  - texto: >-
      Prohibir por ley las regularizaciones masivas e indiscriminadas y que el arraigo sea un reconocimiento
      individual excepcional.
    partidos:
      - { partido: pp, fuente: pp-programa-reconstruccion-nacional, pagina: "22-23" }
  - texto: Repatriarlas y que quien haya entrado de forma irregular no pueda regularizar nunca su situación.
    partidos:
      - { partido: vox, fuente: vox-programa-es-sentido-comun, pagina: 15 }
revisado: 2026-11-22
