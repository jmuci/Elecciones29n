tema: igualdad-derechos
orden: 1
pregunta: ¿Qué medida de igualdad y derechos te parece prioritaria?
opciones:
  - texto: Proteger en la Constitución el derecho al aborto y mantener el derecho a la eutanasia.
    partidos:
      - { partido: psoe, fuente: psoe-nota-aborto-constitucion-granada, pagina: primer párrafo }
  - texto: >-
      Combatir la violencia de género con dispositivos de alejamiento fiables, bajo el Ministerio del Interior,
      e integrando los servicios asistenciales en VioGen.
    partidos:
      - { partido: pp, fuente: pp-programa-reconstruccion-nacional, pagina: 19 }
  - texto: >-
      Desplegar todos los recursos del Pacto de Estado contra la Violencia de Género y aplicar todas las medidas
      de la ley «solo sí es sí».
    partidos:
      - { partido: podemos, fuente: podemos-documento-politico-v-asamblea, pagina: 35 }
  - texto: Prohibir el burka y el niqab en los espacios públicos.
    partidos:
      - { partido: vox, fuente: vox-recuperar-espana, pagina: 3 }
