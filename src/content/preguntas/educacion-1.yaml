tema: educacion
orden: 1
pregunta: ¿Qué debería primar en la política educativa?
opciones:
  - texto: >-
      Un nuevo marco educativo que sustituya a la LOMLOE, con refuerzo en el mismo curso para el alumnado con
      dificultades de lectura y cálculo.
    partidos:
      - { partido: pp, fuente: pp-programa-reconstruccion-nacional, pagina: 67 }
  - texto: Más becas y una formación profesional de calidad para reducir el abandono escolar.
    partidos:
      - { partido: psoe, fuente: psoe-programa-la-fuerza-de-seguir-avanzando, pagina: 53 }
  - texto: >-
      Avanzar hacia una única red educativa de gestión pública, aumentar su financiación pública y bajar las
      ratios de alumnos.
    partidos:
      - { partido: podemos, fuente: podemos-programa-paz-casa-trabajo, pagina: "79-80" }
  - texto: >-
      Derogar la LOMLOE, sacar de las aulas los contenidos «ideológicos» y reforzar la exigencia y la autoridad
      del profesor.
    partidos:
      - { partido: vox, fuente: vox-programa-es-sentido-comun, pagina: 41 }
revisado: 2026-11-22
