tema: vivienda
orden: 1
pregunta: ¿Qué debería hacer el Estado con el precio del alquiler?
opciones:
  - texto: Regular los precios del alquiler y bajarlos en todo el país.
    partidos:
      - { partido: podemos, fuente: podemos-documento-politico-v-asamblea, pagina: 31 }
  - texto: >-
      Limitarlos solo de forma temporal y excepcional en zonas tensionadas, y que el Estado garantice el cobro
      al propietario si el inquilino es vulnerable y no tiene alternativa habitacional.
    partidos:
      - { partido: democracia-21, fuente: democracia-21-vivienda-prioridad-1, pagina: 4 }
  - texto: >-
      Retirar las medidas de intervención en el mercado del alquiler y dar incentivos fiscales al alquiler de
      larga duración y asequible.
    partidos:
      - { partido: vox, fuente: vox-programa-economico-vivienda, pagina: 45 }
revisado: 2026-11-02
