tema: seguridad-justicia
orden: 1
pregunta: ¿Qué enfoque de seguridad prefieres?
opciones:
  - texto: >-
      Reconocer a la Policía Nacional y la Guardia Civil como profesiones de riesgo, con equiparación salarial y
      protección jurídica.
    partidos:
      - { partido: pp, fuente: pp-programa-reconstruccion-nacional, pagina: 20 }
  - texto: Deportar a quienes cometan delitos graves o delitos leves de forma habitual.
    partidos:
      - { partido: vox, fuente: vox-programa-es-sentido-comun, pagina: 15 }
  - texto: Reforzar el control y la transparencia de la actuación policial, con identificación visible de los agentes y cámaras corporales.
    partidos:
      - { partido: podemos, fuente: podemos-programa-paz-casa-trabajo, pagina: 132 }
