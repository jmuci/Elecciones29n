pregunta: "¿Qué debería cambiar en la regulación del despido y la contratación?"
opciones:
  - titulo: "Reformar la indemnización por despido improcedente para que repare el daño"
    detalle:
      - "La reparación del despido improcedente sería efectiva, proporcionada y disuasoria."
      - "Una propuesta recupera los salarios de tramitación; la otra, la autorización administrativa previa para los despidos colectivos, y elimina las dobles escalas salariales."
