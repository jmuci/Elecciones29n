  - titulo: "Un nuevo Estatuto de los Trabajadores que derogue los efectos de las reformas laborales de 2010 y 2012"
    detalle:
      - "Restablecer la indemnización de 45 días por año en los despidos ilegales, con derecho a elegir entre indemnización o readmisión."
      - "Recuperar la autorización administrativa previa para los despidos colectivos (ERE)."
      - "Eliminar la contratación temporal sin causa durante 90 días al año."
    partidos:
      - { partido: podemos, fuente: podemos-programa-paz-casa-trabajo, pagina: 42 }
  - titulo: "Derogar la legislación laboral aprobada por el Gobierno de Sánchez"
