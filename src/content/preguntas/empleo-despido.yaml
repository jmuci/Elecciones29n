  - titulo: "Reducir las cotizaciones por desempleo de las empresas con plantillas más estables"
    detalle:
      - "Cotizarían menos las empresas con plantillas más estables que la media de su sector."
      - "Publicar cada mes cuántos fijos discontinuos no están trabajando."
