tema: pensiones
orden: 1
pregunta: "¿Qué garantía deberían tener las pensiones?"
opciones:
  - titulo: "Proteger en la Constitución las pensiones y su revalorización conforme al IPC"
    detalle:
      - "Reforma constitucional para blindar el sistema público de pensiones y su revalorización conforme al IPC."
      - "Una propuesta añade que ninguna pensión sea inferior al salario mínimo y que no se privatice su gestión."
    partidos:
      - { partido: psoe, fuente: psoe-programa-la-fuerza-de-seguir-avanzando, pagina: 41 }
      - { partido: frente-amplio, fuente: frente-amplio-programa-29n, pagina: "63-64" }
  - titulo: "Subir las pensiones cada año con el IPC y reconstruir el Pacto de Toledo"
    detalle:
      - "Las pensiones mantendrían su poder adquisitivo y subirían cada año con el IPC; lo mismo se aseguraría a las pensiones futuras de los más jóvenes."
      - "Reconstruir el Pacto de Toledo sobre el principio de que las pensiones son un compromiso de Estado."
    partidos:
      - { partido: pp, fuente: pp-programa-reconstruccion-nacional, pagina: "42-43" }
  - titulo: "Equiparar la pensión mínima contributiva al salario mínimo"
    detalle:
      - "La pensión no contributiva se equipararía al 80 % del salario mínimo."
    partidos:
      - { partido: podemos, fuente: podemos-programa-paz-casa-trabajo, pagina: 44 }
