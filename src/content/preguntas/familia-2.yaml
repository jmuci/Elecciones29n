tema: familia
orden: 2
pregunta: ¿Deberían los españoles tener preferencia en el acceso a servicios y ayudas públicas?
opciones:
  - texto: Sí, con acceso preferente a la vivienda pública, las plazas de guardería y las ayudas sociales.
    partidos:
      - { partido: vox, fuente: vox-recuperar-espana, pagina: 3 }
  - texto: No; los servicios públicos y los derechos deben ser los mismos para todas las personas que viven en España.
    partidos:
      - { partido: podemos, fuente: podemos-documento-politico-v-asamblea, pagina: 34 }
revisado: 2026-11-02
